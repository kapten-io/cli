openapi: 3.0.0
info:
  version: 1.0.0
  title: Kapten API
  description: Manage projects, environments, applications, jobs, databases, pipelines, clusters and their configuration.
  contact:
    url: https://kapten.io
    name: Kapten Support
    email: support@kapten.io
servers:
  - url: https://api.kapten.io
    description: Production
  - url: https://api-staging.kapten.io
    description: Staging
  - url: http://localhost:9000
    description: Local development stack
security:
  - bearerAuth: []
tags:
  - name: authorization
    description: Resources that Role grants can target
  - name: cluster
    description: Kubernetes clusters connected to the organization
  - name: container-registry
    description: Registries Kapten pulls images from and pushes builds to
  - name: application
    description: Long-running applications, built from GitHub or deployed from an image
  - name: database
    description: PostgreSQL, MySQL, MongoDB and Redis databases
  - name: cache
    description: Cache management
  - name: component
    description: Every component of an environment, and their logs
  - name: pipeline
    description: Deploy several components in ordered stages
  - name: Project Variables
    description: Variables shared by every environment of a project
  - name: Environment Variables
    description: Variables shared by every component of an environment
  - name: Component Variables
    description: Variables of one component
  - name: Component Secret
    description: Secrets of one component
  - name: Project Secret
    description: Secrets shared by every environment of a project
  - name: Environment Secret
    description: Secrets shared by every component of an environment
  - name: github
    description: GitHub App installations, their repositories and branches
  - name: audit
    description: Changes made to the organization's resources
  - name: usage
    description: Environment usage, metered per minute
paths:
  /audit-events:
    get:
      operationId: listAuditEvents
      x-cli-ignore: true
      tags:
        - audit
      summary: List audit events
      description: 'Events recorded in the token''s organization about projects, environments, components, variables, pipelines, clusters and integrations, newest first. Without a target filter it requires audit:read on the organization and returns every event, including denials and their origin. With `target_type` `project` or `environment` and a `target_id`, the read Permission on that resource is enough: the events about it and everything it contains are returned, without denials or origin. The Auth API serves the organization''s own events (members, Roles, OAuth applications, sign-ins) with the same schema and filters.'
      parameters:
        - $ref: '#/components/parameters/audit_action'
        - $ref: '#/components/parameters/audit_actor_id'
        - $ref: '#/components/parameters/audit_target_type'
        - $ref: '#/components/parameters/audit_target_id'
        - $ref: '#/components/parameters/audit_affected_user_id'
        - $ref: '#/components/parameters/audit_outcome'
        - $ref: '#/components/parameters/audit_changed_field'
        - $ref: '#/components/parameters/audit_since'
        - $ref: '#/components/parameters/audit_until'
        - $ref: '#/components/parameters/audit_cursor'
        - $ref: '#/components/parameters/audit_limit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/audit_event_page'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/aws:
    post:
      summary: Provision an AWS EKS control plane and fixed On-Demand pools
      description: Atomically reserves a provisioned cluster, immutable infrastructure revision and durable create operation. The same operation creates the VPC, restricted EKS control plane, protected kapten pool and fixed On-Demand workload pools. It verifies observed AWS capacity and network configuration and leaves initialization and readiness incomplete. Same organization/action/key and request replays return the existing admission; conflicting requests return 409. Custom enrollment remains POST /cluster.
      operationId: provisionCluster
      x-cli-name: provision-aws
      tags:
        - clusters
        - cluster
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionClusterInput'
      responses:
        '202':
          description: Durable cluster operation admitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmission'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/destroy:
    post:
      summary: Destroy a fixed-capacity provisioned cluster
      description: Requires cluster-delete permission and no dependent environments, components or active work. Admits durable cleanup; new dependent work remains blocked even if cleanup fails. The same key replays the original attempt. After a failed attempt's workflow closes, submit a new key to resume cleanup with the same revision and state. Retained user data, unknown dependencies, unavailable credentials and unsupported dynamic capacity block completion. History is preserved; credentials are released only after verified cleanup. Custom clusters remain externally owned and cannot use this action.
      operationId: destroyCluster
      x-cli-name: destroy
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '202':
          description: Durable destruction accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmission'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/reconcile:
    post:
      summary: Reconcile a cluster's platform add-ons
      description: Requires cluster-update permission. Admits a durable reconcile operation on the cluster's current revision. It applies the cluster's current settings (built-in registry, networks) and brings its platform add-ons to this Engine's versions. Refused while another operation of the cluster is in progress or before its provisioning succeeded. The cluster keeps serving and stays READY; the operation records the outcome. A failed reconcile is followed by a new one, not by a retry.
      operationId: reconcileCluster
      x-cli-name: reconcile
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      responses:
        '202':
          description: Durable reconcile accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmission'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/operations:
    get:
      summary: List durable cluster operations
      description: Returns up to 100 most recent operations from persistence, including failed operations and their last actionable phase.
      operationId: listClusterOperations
      x-cli-name: list-operations
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      responses:
        '200':
          description: Cluster operation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterOperation'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/operations/{operation_id}:
    get:
      summary: Read cluster operation progress and admitted revision
      operationId: getClusterOperation
      x-cli-name: get-operation
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Durable operation, immutable revision and cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmission'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/operations/{operation_id}/repair:
    post:
      summary: Correct failed cluster creation with a new immutable revision
      description: Requires cluster-update permission and the latest failed creation attempt with a closed workflow. Preserves the cluster, credential, account, region, state and execution versions. Configuration must change; use retry for an unchanged revision. A saved plan against existing state must pass ownership and non-destructive checks before apply. Rejected plans retain infrastructure and expose the blocking resource/action in operation failure details. Durable Custom enrollments may correct observability or replace access credentials for the same Kubernetes cluster; storage identity and capacities remain immutable. No post-success resizing or upgrades. Keys are scoped to organization, repair action and cluster; the same source and request replay, while conflicting reuse returns 409.
      operationId: repairClusterOperation
      x-cli-name: repair-operation
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairClusterInput'
      responses:
        '202':
          description: Correction admitted; poll its durable operation for plan validation and execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmission'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/operations/{operation_id}/retry:
    post:
      summary: Retry cluster provisioning using the original revision
      description: Requires cluster-update permission. Admits a durable retry of the latest failed or interrupted operation after its workflow has closed, preserving configuration, cloud identity, state and completed phases. Interrupted queued dispatches recover automatically under their original identity. Keys are scoped to the organization and cluster; replay returns the admitted result and reuse for another source operation returns 409. Active, successful, superseded and destroy operations cannot be retried. Unknown external outcomes are reconciled before any further mutation. Custom enrollment is unaffected.
      operationId: retryClusterOperation
      x-cli-name: retry-operation
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '202':
          description: Durable retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmission'
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential/aws/{credential_id}/catalog:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Discover EKS configuration capabilities
      description: Requires cluster-create permission and a validated credential in the active organization. Rechecks role identity, region enablement and provider catalogs on each request. A three-AZ catalog is not proof of infrastructure, node distribution, capacity or readiness.
      operationId: getAWSClusterCatalog
      x-cli-name: get-aws-catalog
      tags:
        - cloud-credentials
        - cloud-credential
      parameters:
        - name: region
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9-]+$
      responses:
        '200':
          description: Fresh capability catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterCatalog'
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential/aws/{credential_id}/catalog/validate:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Validate EKS configuration choices
      description: Requires cluster-create permission and rechecks a fresh catalog for this organization credential. Reports input paths and precise compatibility codes. This preflight has no cloud or database mutations and must be repeated at admission. Until a provision-and-initialize profile has been verified, selections fail with profile_not_executable and version_not_tested.
      operationId: validateAWSClusterConfiguration
      x-cli-name: validate-aws-cluster
      tags:
        - cloud-credentials
        - cloud-credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationChoice'
      responses:
        '200':
          description: Choices passed preflight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationValidation'
        '422':
          description: Choices are incompatible or the selected profiles are not executable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationValidation'
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential/aws/{credential_id}/regions:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Discover enabled AWS regions
      description: Requires cluster-create permission and a validated credential in the active organization. Enabled EC2 regions are not a guarantee of EKS eligibility or available capacity; query the regional catalog next.
      operationId: listAWSRegions
      x-cli-name: list-aws-regions
      tags:
        - cloud-credentials
        - cloud-credential
      responses:
        '200':
          description: Enabled regions for the credential
          content:
            application/json:
              schema:
                type: object
                required:
                  - regions
                properties:
                  regions:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential:
    get:
      summary: List reusable cloud credentials in the active organization
      description: Requires cluster-create or credential-management permission. Includes pending and invalid credentials with validation status.
      operationId: listCloudCredentials
      x-cli-name: list
      tags:
        - cloud-credentials
        - cloud-credential
      parameters:
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
      responses:
        '200':
          description: Organization cloud credentials
          content:
            application/json:
              schema:
                type: object
                required:
                  - records
                  - total_records
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/credential'
                  total_records:
                    type: integer
                    format: int64
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential/aws:
    post:
      summary: Begin AWS role onboarding
      description: Requires credential-management permission. Returns a generated external ID and trust/permission guidance. Configure the role in AWS, then validate it. Role identity is immutable; use a new credential for a different role.
      operationId: createAWSCloudCredential
      x-cli-name: create-aws
      tags:
        - cloud-credentials
        - cloud-credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - role_arn
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                role_arn:
                  type: string
                  minLength: 20
                  maxLength: 2048
      responses:
        '201':
          description: Pending credential and onboarding guidance; AWS trust has not yet been verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credential'
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential/aws/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get AWS credential metadata and onboarding guidance
      operationId: getAWSCloudCredential
      x-cli-name: get-aws
      tags:
        - cloud-credentials
        - cloud-credential
      responses:
        '200':
          description: AWS credential in the active organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credential'
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete an unused cloud credential
      description: Requires credential-management permission. Returns conflict while any tracked cluster, including failed or soft-deleted infrastructure, retains a reference.
      operationId: deleteCloudCredential
      x-cli-name: delete
      tags:
        - cloud-credentials
        - cloud-credential
      responses:
        '204':
          description: Credential deleted
        default:
          $ref: '#/components/responses/error_response'
  /cloud-credential/aws/{credential_id}/validate:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Validate AWS role assumption and account identity
      description: Requires credential-management permission. Returns persisted validation status and sanitized failure guidance. A successful identity check does not certify every provisioning permission.
      operationId: validateAWSCloudCredential
      x-cli-name: validate-aws
      tags:
        - cloud-credentials
        - cloud-credential
      responses:
        '200':
          description: Credential with the latest validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credential'
        default:
          $ref: '#/components/responses/error_response'
  /authorization/resources:
    get:
      operationId: listAuthorizationResources
      x-cli-ignore: true
      tags:
        - authorization
      summary: List resources for Role grants
      description: Names and IDs of the organization's resources that a Role grant can target. Requires the Permission to create or update Roles. Returns no secret.
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - project
              - environment
              - cluster
              - integration
        - in: query
          name: ids
          description: Optional comma-separated UUIDs to validate (at most 100).
          schema:
            type: string
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Up to 100 identities; request the next offset until fewer than 100 records are returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - records
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        parentName:
                          type: string
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '503':
          description: Authorization or resource catalog unavailable
  /cluster:
    get:
      summary: List clusters
      description: Returns the organization's clusters, a page at a time.
      operationId: listClusters
      x-cli-name: list
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
        - $ref: '#/components/parameters/with_deleted'
      responses:
        '200':
          description: List of clusters retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Enroll an existing Kubernetes cluster with durable initialization
      description: Admits a Custom enrollment with immutable configuration, durable operations and configurable observability. Supply a self-contained base64-encoded kubeconfig. No cloud credential or Terraform state is needed. Storage must use a dynamic Retain StorageClass; omit storage_class only when there is exactly one default. Uses the single-replica profile with no high-availability guarantee.
      operationId: createCluster
      x-cli-name: create
      tags:
        - clusters
        - cluster
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollClusterInput'
      responses:
        '202':
          description: Durable cluster operation admitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmission'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}:
    parameters:
      - $ref: '#/components/parameters/cluster_id'
    get:
      summary: Get a cluster
      description: Returns a cluster.
      operationId: getCluster
      x-cli-name: get
      tags:
        - clusters
        - cluster
      responses:
        '200':
          description: Cluster retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
    put:
      summary: Update a cluster
      description: Renames a cluster or turns its built-in registry on or off. Use failed-operation repair to correct kubeconfig access or initialization settings.
      operationId: updateCluster
      x-cli-name: update
      tags:
        - clusters
        - cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_cluster_dto'
      responses:
        '200':
          description: Cluster updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
    delete:
      summary: Delete a cluster
      description: Removes a cluster from the organization.
      operationId: deleteCluster
      x-cli-name: delete
      tags:
        - clusters
        - cluster
      responses:
        '204':
          description: Cluster deleted successfully
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/backup-destination:
    parameters:
      - $ref: '#/components/parameters/cluster_id'
    put:
      summary: Set a cluster's backup destination
      description: Checks the bucket by writing and deleting a test object, then makes it where the cluster's databases write their backups from their next deployment. A bucket the check cannot write to returns 422.
      operationId: setClusterBackupDestination
      x-cli-name: set-backup-destination
      tags:
        - clusters
        - cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/set_cluster_backup_destination_dto'
      responses:
        '200':
          description: Backup destination set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
    delete:
      summary: Remove a cluster's backup destination
      description: Removes the backup destination and its keys. Databases that need a bucket for their backups stop backing up from their next deployment.
      operationId: removeClusterBackupDestination
      x-cli-name: remove-backup-destination
      tags:
        - clusters
        - cluster
      responses:
        '200':
          description: Backup destination removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/networks:
    parameters:
      - $ref: '#/components/parameters/cluster_id'
    get:
      summary: List the networks of a cluster
      description: 'Returns the networks application ports can be served on: the public network, the managed networks, and the Gateways labelled `kapten.io/network` in the cluster.'
      operationId: listClusterNetworks
      x-cli-name: list-networks
      tags:
        - clusters
        - cluster
      responses:
        '200':
          description: Networks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster_network_list'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Add a managed network to a cluster
      description: 'Adds a network served by its own Gateway, whose Envoy Service Kapten creates with the given type, load balancer class and annotations. Use it to serve applications on a private network, such as a Tailscale tailnet (`loadBalancerClass: tailscale`) or a NetBird network (`CLUSTER_IP` with the `netbird.io/expose` annotation).'
      operationId: createClusterNetwork
      x-cli-name: create-network
      tags:
        - clusters
        - cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_cluster_network'
      responses:
        '201':
          description: Network created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster_network'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/networks/{network_id}:
    parameters:
      - $ref: '#/components/parameters/cluster_id'
      - $ref: '#/components/parameters/network_id'
    patch:
      summary: Update a managed network
      description: Replaces the Envoy Service settings of a managed network. The name never changes, since it is part of the network's hostnames.
      operationId: updateClusterNetwork
      x-cli-name: update-network
      tags:
        - clusters
        - cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cluster_network_service'
      responses:
        '200':
          description: Network updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster_network'
        default:
          $ref: '#/components/responses/error_response'
    delete:
      summary: Delete a managed network
      description: Deletes a managed network. The public network cannot be deleted, and an external network leaves when its Gateway loses the `kapten.io/network` label.
      operationId: deleteClusterNetwork
      x-cli-name: delete-network
      tags:
        - clusters
        - cluster
      responses:
        '204':
          description: Network deleted
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/registry:
    parameters:
      - $ref: '#/components/parameters/cluster_id'
    get:
      summary: Get the cluster registry health
