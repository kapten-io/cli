        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/component_run_logs_request'
            examples:
              timelineView:
                summary: Timeline only
                value:
                  view: timeline
                  limit: 200
                  source:
                    - control_plane
                    - agent
              rawView:
                summary: Raw run-scoped records only
                value:
                  view: raw
                  levels:
                    - info
                    - warn
                    - error
                  text: helm
              bothView:
                summary: Timeline and raw records
                value:
                  view: both
                  from: '2026-07-03T10:00:00Z'
                  to: '2026-07-03T10:30:00Z'
                  limit: 500
