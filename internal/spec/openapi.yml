    audit_actor:
      type: object
      description: Who acted, as they were when they did.
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - user
            - client
            - system
        id:
          type: string
          description: The user or client UUID, `system`, or `unknown` for someone who did not prove who they are.
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
    audit_target:
      type: object
      required:
        - type
        - id
        - relation
      properties:
        type:
          type: string
          description: A Resource Type, such as `role`, `project`, `environment` or `kapplication`.
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: The object's name when the event happened, if known.
        relation:
          type: string
          enum:
            - primary
            - ancestor
    audit_person:
      type: object
      nullable: true
      description: The person acted upon, when it is not the actor; `id` is null for an invitee without an account.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
    audit_changes:
      type: object
      nullable: true
      description: Values of the changed fields before and after; a field holding a secret is in `changed_fields` but never here.
      properties:
        before:
          type: object
          nullable: true
          additionalProperties: true
        after:
          type: object
          nullable: true
          additionalProperties: true
    audit_origin:
      type: object
      description: Where the request came from. Omitted fields are not shown to resource readers.
      required:
        - entry_point
      properties:
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        entry_point:
          type: string
          enum:
            - http
            - web
            - internal
        request_id:
          type: string
          nullable: true
    audit_event:
      type: object
      description: One audit record. The Platform and Auth APIs serve the same schema; `source` says which recorded it.
      required:
        - id
        - source
        - occurred_at
        - action
        - actor
        - targets
        - outcome
        - changed_fields
        - metadata
        - origin
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7, unique within its source.
        source:
          type: string
          enum:
            - auth
            - engine
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: Null for events before an organization is known, such as a failed sign-in.
        occurred_at:
          type: string
          format: date-time
          description: Transaction time of the change, from the source's database clock.
        action:
          type: string
          description: Dotted name from the source's closed catalog, such as `member.roles_updated` or `environment.deleted`.
        actor:
          $ref: '#/components/schemas/audit_actor'
        targets:
          type: array
          description: The objects the event acted on (`primary`) and the objects containing them (`ancestor`), as named then.
          items:
            $ref: '#/components/schemas/audit_target'
        affected_user:
          $ref: '#/components/schemas/audit_person'
        outcome:
          type: string
          enum:
            - allowed
            - denied
        denial_reason:
          type: string
          nullable: true
          description: Why a denied action was refused, such as the missing Permission.
        changed_fields:
          type: array
          items:
            type: string
        changes:
          $ref: '#/components/schemas/audit_changes'
        metadata:
          type: object
          additionalProperties: true
          description: 'Small action-specific details. Two keys are reserved for what the system records on behalf of someone, when work they started finishes later: `initiated_by`, the actor who started it (`type`, `id`, and `email` or `name` when known), and `caused_by`, the id of the event that started it. A refusal that stands for repeats of itself carries `repeats`, how many identical refusals were dropped since the previous one recorded.'
        origin:
          $ref: '#/components/schemas/audit_origin'
    audit_event_page:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/audit_event'
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next, older page; null on the last page.
