          allOf:
            - $ref: '#/components/schemas/job_type'
          description: Indicates whether the job is a cron or one-time execution.
        timezone:
          type: string
          format: timezone
          description: |
            Specifies the timezone for the cron job. Defaults to UTC.
        cron:
          type: string
          format: cron
          description: |
            Specifies the job schedule using standard cron format (minute hour day month weekday). Does not include seconds field - follows the traditional 5-field cron syntax.
        configuration:
          type: object
          required:
            - cpu_request_in_milli
            - ram_request_in_mib
            - cpu_limit_in_milli
            - ram_limit_in_mib
            - source
            - healthchecks
            - default_port
          properties:
            pool:
              type: string
              description: Optional workload pool. Omit or use an empty string for the cluster default; kapten is reserved.
            cpu_limit_in_milli:
              type: string
              description: Maximum cpu that can be allocated to the job based on organization cluster configuration. unit is millicores (m). 1000m = 1 cpu
              example: 2000m
            ram_limit_in_mib:
              type: string
              description: Maximum memory that can be allocated to the job based on organization cluster configuration. unit is MB. 1024 MB = 1GB
              example: 2048Mi
            cpu_request_in_milli:
              type: string
              description: unit is millicores (m). 1000m = 1 cpu
              example: 1000m
            ram_request_in_mib:
              type: string
              description: unit is MB. 1024 MB = 1GB
              example: 1024Mi
            max_nb_restart:
              type: integer
              minimum: 0
              description: |
                Maximum number of restart allowed before the job is considered as failed
                0 means that no restart/crash of the job is allowed
            max_duration_seconds:
              type: integer
              minimum: 0
              description: |
                Maximum number of seconds allowed for the job to run before killing it and mark it as failed
            default_port:
              type: integer
              minimum: 1
              description: Port where to run readiness and liveliness probes checks. The port will not be exposed externally
              default: null
              nullable: true
            source:
              nullable: false
              oneOf:
