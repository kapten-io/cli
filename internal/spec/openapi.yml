          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_installation_page'
        default:
          $ref: '#/components/responses/error_response'
  /integration/github/installations/{installation_id}:
    delete:
      summary: Disconnect a GitHub installation
      description: 'Disconnects a GitHub installation from the organization. The app stays installed on GitHub: uninstall it there to revoke its access.'
      operationId: disconnectGitHubInstallation
      x-cli-ignore: true
      tags:
        - github
      parameters:
        - $ref: '#/components/parameters/github_installation_id'
      responses:
        '204':
          description: GitHub installation disconnected
        default:
          $ref: '#/components/responses/error_response'
  /integration/github/installations/{installation_id}/repositories:
    get:
      summary: List installation repositories
      description: Returns the repositories the GitHub installation can read now.
      operationId: listGitHubRepositories
      x-cli-ignore: true
      tags:
        - github
      parameters:
        - $ref: '#/components/parameters/github_installation_id'
        - $ref: '#/components/parameters/github_page'
        - $ref: '#/components/parameters/github_per_page'
      responses:
        '200':
          description: Live GitHub repositories retrieved
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_repository_page'
        '422':
          description: Installation is inactive or inaccessible
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '503':
          description: GitHub is temporarily unavailable
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
            Retry-After:
              $ref: '#/components/headers/retry_after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/error_response'
  /integration/github/installations/{installation_id}/repositories/{repository_id}/branches:
    get:
      summary: List repository branches
      description: Returns a repository's branches, read from GitHub, once the installation is checked to still have access to the repository.
      operationId: listGitHubRepositoryBranches
      x-cli-ignore: true
      tags:
        - github
      parameters:
        - $ref: '#/components/parameters/github_installation_id'
        - $ref: '#/components/parameters/github_repository_id'
        - $ref: '#/components/parameters/github_page'
        - $ref: '#/components/parameters/github_per_page'
      responses:
        '200':
          description: Live GitHub branches retrieved
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_branch_page'
        '422':
          description: Installation or repository is inactive or inaccessible
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '503':
          description: GitHub is temporarily unavailable
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
            Retry-After:
              $ref: '#/components/headers/retry_after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/error_response'
  /usage/environments:
    get:
      operationId: getEnvironmentUsage
      x-cli-name: environments
      tags:
        - usage
      summary: Get environment usage
      description: 'How long each environment of the token''s organization was active in the period [since, until), from its creation to its deletion. Usage is counted in hourly UTC windows: both bounds are truncated to the hour, and a period spans at most 93 days. Only hours before `closed_through` are counted, and an hour closes about five minutes after it ends. Environments that were not active in the period are left out. Requires organization_update on the organization. The billable minutes are the ones the subscription is billed for.'
      parameters:
        - name: since
          in: query
          required: true
          description: Start of the period, truncated to the hour.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: true
          description: End of the period (exclusive), truncated to the hour.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The usage of the period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment_usage_report'
        default:
          $ref: '#/components/responses/error_response'
