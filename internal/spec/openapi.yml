  schemas:
    cluster:
      type: object
      required:
        - id
        - organization_id
        - name
        - cloud_provider
        - state
        - created_at
        - update_at
        - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        organization_id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: The name of the cluster.
        cloud_provider:
          $ref: '#/components/schemas/cloud_provider'
        state:
          $ref: '#/components/schemas/cluster_state'
        created_at:
          type: string
          format: date-time
          description: The timestamp when the cluster was created.
        update_at:
          type: string
          format: date-time
          description: The timestamp when the cluster was last updated.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when the cluster was deleted updated.
      example:
        cloud_provider: aws
        created_at: '2025-06-10T22:16:02Z'
        deleted_at: '2025-06-10T22:16:02Z'
        id: 7362e0d0-72ed-c77b-5c42-f9af9d52fd5f
        name: zKC
        organization_id: 7a60f26d-0106-02f5-ccf5-98b7c4cdc513
        state: INITIALIZED
        update_at: '2025-06-10T22:16:02Z'
    cluster_state:
      type: string
      enum:
        - UNKOWN
        - READY
        - DEPLOYED
        - DEPLOYING
        - DEPLOY_QUEUED
        - DEPLOY_ERROR
        - INITIALIZING
        - INITIALIZED
        - INITIALIZE_QUEUED
        - INITIALIZE_ERROR
        - STOPED
        - STOPING
        - STOP_QUEUED
        - STOP_ERROR
        - RESTART
        - RESTARTING
        - RESTART_QUEUED
        - RESTART_ERROR
      description: The current lifecycle state of the cluster.
    create_cluster_dto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: The name of the cluster.
        cloud_provider:
          $ref: '#/components/schemas/cloud_provider'
        kube_config:
          type: string
          format: byte
          description: The base64-encoded Kubernetes configuration for the cluster.
      required:
        - name
        - cloud_provider
        - kube_config
      example:
        name: my-production-cluster
        cloud_provider: aws
        kube_config: YXBpVmVyc2lvbjogdjEKY2x1c3RlcnM6Ci0gY2x1c3RlcjoKICAgIGNlcnRpZmljYXRlLWF1dGhvcml0eS1kYXRhOiBMUzB0TFMwdENrMUZUa1JEUXk1c2NITUtMUzB0TFMwPQogICAgc2VydmVyOiBodHRwczovL2t1YmVybmV0ZXMuZXhhbXBsZS5jb20KICBuYW1lOiBleGFtcGxlLWNsdXN0ZXIK
    update_cluster_dto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: The name of the cluster.
        kube_config:
          type: string
          format: byte
          description: The base64-encoded Kubernetes configuration for the cluster.
      example:
        name: my-production-cluster
        kube_config: YXBpVmVyc2lvbjogdjEKY2x1c3RlcnM6Ci0gY2x1c3RlcjoKICAgIGNlcnRpZmljYXRlLWF1dGhvcml0eS1kYXRhOiBMUzB0TFMxQ1JVZEpUaUJEUlZKVVNVWkpRMEZVUlMwdExTMHQ=
    error:
      type: object
      description: An error response object containing a status code and descriptive message
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        reason:
          type: string
          description: Optional stable machine-readable reason for programmatic error handling
    logs_query_request:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The user-provided LogsQL query fragment.
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 200
          description: Maximum number of most recent log entries to return.
    logs_query_entry:
      type: object
      required:
        - msg
        - time
      properties:
        msg:
          description: The normalized log payload as an arbitrary JSON value.
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
            - type: number
            - type: boolean
            - type: array
              items: {}
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
        time:
          type: string
          description: The RFC3339 or RFC3339Nano timestamp returned by Victoria Logs.
        level:
          type: string
          description: The log level, or an empty string when missing from the source record.
        project_id:
          type: string
          description: The Kapten project identifier associated with the log entry when present in the source record.
        environment_id:
          type: string
          description: The Kapten environment identifier associated with the log entry when present in the source record.
        component_id:
          type: string
          description: The Kapten component identifier associated with the log entry when present in the source record.
        component_type:
          type: string
          description: The Kapten component type associated with the log entry when present in the source record.
        component_run_id:
          type: string
        component_kind:
          type: string
        source:
          type: string
          enum:
            - control_plane
            - agent
            - builder
        step:
          type: string
        phase:
          type: string
        backend:
          type: string
        backend_step:
          type: string
        run_status:
          type: string
        duration_ms:
          type: integer
          format: int64
        error_kind:
          type: string
        metadata:
          type: object
          additionalProperties: true
        event:
          type: string
          enum:
            - kapten.build.phase
        event_version:
          type: integer
          format: int32
        platform:
          type: string
          enum:
            - linux/amd64
            - linux/arm64
        publication:
          type: string
          enum:
            - child_manifest
            - final_index
    logs_query_response:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/logs_query_entry'
    component_run_logs_request:
      type: object
      description: Constrained Component Run Logs request. Does not accept arbitrary LogsQL; clients can only select a view, bounded time range, limit, levels, event sources, and message text.
      additionalProperties: false
      properties:
        view:
          type: string
          enum:
            - timeline
            - raw
            - both
          default: both
          description: Which run log projection to return.
        from:
          type: string
          format: date-time
          description: Inclusive lower bound for the run log time range.
        to:
          type: string
          format: date-time
          description: Inclusive upper bound for the run log time range.
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 200
          description: Maximum number of most recent raw backend records to query.
        levels:
          type: array
          items:
            type: string
