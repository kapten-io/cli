              schema:
                $ref: '#/components/schemas/component_run'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/environment/{environment_id}/application/{application_id}/runs/{component_run_id}/logs:
    post:
      summary: Query application run logs
      description: |
        Returns the deployment logs of one application run: what Kapten and the image build did while deploying it, and what its agent on the cluster did. For the application's own output, use the component logs.

        Without `from` or `to`, the window spans the run, from its start to its end. Logs follow the retention of the log backend, so the logs of an old run may be gone, and runs from before run logs existed return an empty list.
      operationId: queryApplicationRunLogs
      x-cli-name: query-run-logs
      tags:
        - applications
        - application
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
        - $ref: '#/components/parameters/application_id'
        - $ref: '#/components/parameters/component_run_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/component_run_logs_request'
            examples:
              timelineView:
                summary: Timeline only
                value:
                  view: timeline
                  limit: 200
                  source:
                    - control_plane
                    - agent
                    - builder
              rawView:
                summary: Raw run-scoped records only
                value:
                  view: raw
                  levels:
                    - info
                    - warn
                    - error
                  text: helm
              bothView:
                summary: Timeline and raw records
                value:
                  view: both
                  from: '2026-07-03T10:00:00Z'
                  to: '2026-07-03T10:30:00Z'
                  limit: 500
      responses:
        '200':
          description: Application run logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/component_run_logs_response'
        default:
          $ref: '#/components/responses/error_response'
  /integration/github/connection-sessions:
    post:
      summary: Start connecting GitHub
      description: Starts installing Kapten's GitHub App for the organization. Returns the GitHub URL to send the user to; GitHub sends them back to Kapten once the app is installed.
      operationId: createGitHubConnectionSession
      x-cli-ignore: true
      tags:
        - github
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_connection_session_request'
      responses:
        '200':
          description: GitHub connection session created
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_connection_session_response'
        default:
          $ref: '#/components/responses/error_response'
  /integration/github/setup-return:
    get:
      summary: Return from GitHub App setup
      description: Where GitHub sends the browser back after the app is installed. Completes the setup like completeGitHubSetup, then redirects to the console. On failure, it redirects to the console's GitHub settings with a `github_setup_error` code instead of returning an error.
      operationId: returnFromGitHubSetup
      x-cli-ignore: true
      tags:
        - github
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: installation_id
          in: query
          schema:
            type: string
        - name: setup_action
          in: query
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the console
          headers:
            Location:
              $ref: '#/components/headers/location'
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
    post:
      summary: Complete GitHub App setup
      description: Completes a GitHub App installation started with createGitHubConnectionSession, from the setup state GitHub returned.
      operationId: completeGitHubSetup
      x-cli-ignore: true
      tags:
        - github
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_setup_return_request'
      responses:
        '200':
          description: GitHub setup reached a terminal outcome
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_setup_result'
        '400':
          $ref: '#/components/responses/error_response'
        '401':
          $ref: '#/components/responses/error_response'
        '409':
          $ref: '#/components/responses/error_response'
        '410':
          $ref: '#/components/responses/error_response'
        '500':
          $ref: '#/components/responses/error_response'
        '503':
          description: GitHub is temporarily unavailable while verifying the installation
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache_control_no_store'
            Retry-After:
              $ref: '#/components/headers/retry_after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/error_response'
  /integration/github/installations:
    get:
      summary: List GitHub installations
      description: Returns the organization's GitHub App installations.
      operationId: listGitHubInstallations
      x-cli-ignore: true
      tags:
        - github
