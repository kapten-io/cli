          format: date-time
          description: End of the last closed hour; later hours are not counted yet.
        environments:
          type: array
          items:
            $ref: '#/components/schemas/environment_usage'
        days:
          type: array
          description: Billable minutes per UTC day, for the days of the period with usage, in order. They add up to the environments' billable minutes.
          items:
            $ref: '#/components/schemas/environment_usage_day'
  responses:
    error_response:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  headers:
    cache_control_no_store:
      description: Prevents storage of GitHub integration response data.
      schema:
        type: string
        enum:
          - no-store
    location:
      description: Absolute URL the client is redirected to.
      required: true
      schema:
        type: string
        format: uri
    retry_after:
      description: Safe retry delay in seconds or an HTTP date when known.
      schema:
        type: string
