        - organization_id
        - name
        - provider
        - role_arn
        - external_id
        - account_id
        - validation_status
        - validation_error
        - validated_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum:
            - aws
        role_arn:
          type: string
        external_id:
          type: string
          description: Kapten-generated trust-association metadata, not an AWS secret.
        account_id:
          type: string
          description: Verified AWS account; empty until validation succeeds.
        validation_status:
          type: string
          enum:
            - pending
            - valid
            - invalid
        validation_error:
          type: string
        validated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        guidance:
          type: object
          required:
            - trust_policy
            - permissions
          properties:
            trust_policy:
              type: object
              additionalProperties: true
            permissions:
              type: array
              items:
                type: string
    EnrollClusterInput:
      type: object
      additionalProperties: false
      required:
        - name
        - kube_config
      properties:
        cloud_provider:
          type: string
          enum:
            - custom
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        kube_config:
          type: string
          format: byte
          minLength: 1
          maxLength: 1398104
          writeOnly: true
        storage_class:
          type: string
          minLength: 1
          maxLength: 253
        observability:
          $ref: '#/components/schemas/ClusterObservabilityInput'
    create_container_registry_common:
      type: object
      required:
        - name
        - type
        - url
      properties:
        name:
          type: string
          description: Name of the container registry.
        description:
          type: string
          description: Optional container registry description.
        type:
          allOf:
            - $ref: '#/components/schemas/container_registry_type'
          description: Container registry type discriminator.
        url:
          type: string
          description: Full container registry URL.
    create_standard_container_registry:
      allOf:
        - $ref: '#/components/schemas/create_container_registry_common'
        - type: object
          required:
            - username
            - password
          properties:
            type:
              type: string
              enum:
                - STANDARD
            username:
              type: string
              description: Registry username.
            password:
              type: string
              description: Registry password.
      description: Create a standard container registry.
    create_ecr_container_registry:
      allOf:
        - $ref: '#/components/schemas/create_container_registry_common'
        - type: object
          required:
            - access_key_id
            - secret_access_key
            - region
          properties:
            type:
              type: string
              enum:
                - ECR
            access_key_id:
              type: string
              description: AWS access key ID.
            secret_access_key:
              type: string
              description: AWS secret access key.
            region:
              type: string
              description: AWS region hosting the registry.
            role_arn:
              type: string
              description: Optional IAM role ARN to assume.
      description: Create an Amazon ECR container registry.
    create_gcp_artifact_registry_container_registry:
      allOf:
        - $ref: '#/components/schemas/create_container_registry_common'
        - type: object
          required:
            - json_credentials
          properties:
            type:
              type: string
              enum:
                - GCP_ARTIFACT_REGISTRY
            json_credentials:
              type: string
              description: JSON-formatted GCP service account credentials.
      description: Create a GCP Artifact Registry container registry.
    create_scaleway_container_registry:
      allOf:
        - $ref: '#/components/schemas/create_container_registry_common'
        - type: object
          required:
            - access_key_id
            - secret_access_key
            - region
          properties:
            type:
              type: string
              enum:
                - SCALEWAY
            access_key_id:
              type: string
              description: Scaleway access key ID.
            secret_access_key:
              type: string
              description: Scaleway secret access key.
            region:
              type: string
              description: Scaleway region hosting the registry.
      description: Create a Scaleway container registry.
    component_run_github_build:
      type: object
      description: Immutable GitHub source and produced artifact evidence for a GitHub-backed component run.
      required:
        - installation_id
        - repository_id
        - repository_full_name
        - branch
        - commit_sha
        - trigger
        - platforms
        - image_reference
        - image_tag
        - index_digest
      properties:
        installation_id:
          $ref: '#/components/schemas/uuid'
        repository_id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: GitHub repository database ID encoded as a decimal string.
        repository_full_name:
          type: string
        branch:
          type: string
        commit_sha:
          type: string
          pattern: ^[0-9a-f]{40}$
        trigger:
          type: string
          enum:
            - manual
            - push
            - pipeline
        image_reference:
          type: string
          nullable: true
          description: Final tagged OCI image reference when artifact production completed.
        image_tag:
          type: string
          nullable: true
          description: Final run-scoped OCI tag when artifact production completed.
        index_digest:
          type: string
          nullable: true
          description: Verified final OCI image index digest when available.
        platforms:
          type: array
          items:
            type: string
            enum:
              - linux/amd64
              - linux/arm64
    application_port_network_url:
      type: object
      required:
        - network
        - url
      properties:
        network:
          type: string
          description: Name of the network.
        url:
          type: string
          description: URL of the port on the network.
    create_database_in_cluster_resources:
      type: object
      properties:
        cpu_request_in_milli:
          type: integer
          format: int64
          minimum: 0
        cpu_limit_in_milli:
          type: integer
          format: int64
          minimum: 0
        ram_request_in_mib:
          type: integer
          format: int64
          minimum: 0
        ram_limit_in_mib:
          type: integer
          format: int64
          minimum: 0
        disk_size_in_gib:
          type: integer
          format: int64
          minimum: 0
    create_database_in_cluster_configuration:
      type: object
      required:
        - resources
      properties:
        pool:
          type: string
          description: Optional workload pool; empty uses the cluster default.
        database_name:
          type: string
          description: Logical database name created inside the engine.
        encrypt_disk:
          type: boolean
          description: Whether the underlying disk should be encrypted.
        activate_high_availability:
          type: boolean
          description: Whether high availability should be enabled.
        activate_backups:
          type: boolean
          description: Whether backups should be enabled.
        resources:
          $ref: '#/components/schemas/create_database_in_cluster_resources'
    create_database_in_cluster:
      type: object
      required:
        - name
        - version
        - accessibility
        - provisioning
        - configuration
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Name of the database.
        description:
          type: string
          description: Optional database description.
        version:
          type: string
          description: Database engine version.
        accessibility:
          allOf:
            - $ref: '#/components/schemas/database_accessibility'
          description: Database network accessibility.
        provisioning:
          type: string
          enum:
            - IN_CLUSTER
          description: Database provisioning strategy.
        configuration:
          $ref: '#/components/schemas/create_database_in_cluster_configuration'
    create_postgresql_in_cluster_database:
      allOf:
        - $ref: '#/components/schemas/create_database_in_cluster'
      description: Create an in-cluster Postgresql database.
    create_database_managed_resources:
      type: object
      properties:
        disk_size_in_gib:
          type: integer
          format: int64
          minimum: 0
        database_instance_tier:
          type: string
        database_disk_type:
          type: string
        database_disk_iops:
          type: integer
          format: int64
          minimum: 0
    create_database_managed_configuration:
      type: object
      required:
        - resources
      properties:
        database_name:
          type: string
          description: Logical database name created inside the engine.
        encrypt_disk:
          type: boolean
          description: Whether the underlying disk should be encrypted.
        activate_high_availability:
          type: boolean
          description: Whether high availability should be enabled.
        activate_backups:
          type: boolean
          description: Whether backups should be enabled.
        resources:
          $ref: '#/components/schemas/create_database_managed_resources'
    create_database_managed:
      type: object
      required:
        - name
        - version
        - accessibility
        - provisioning
        - configuration
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Name of the database.
        description:
          type: string
          description: Optional database description.
        version:
          type: string
          description: Database engine version.
        accessibility:
          allOf:
            - $ref: '#/components/schemas/database_accessibility'
          description: Database network accessibility.
        provisioning:
          type: string
          enum:
            - MANAGED
          description: Database provisioning strategy.
        configuration:
          $ref: '#/components/schemas/create_database_managed_configuration'
    create_postgresql_managed_database:
      allOf:
        - $ref: '#/components/schemas/create_database_managed'
      description: Create a managed Postgresql database.
    create_mysql_in_cluster_database:
      allOf:
        - $ref: '#/components/schemas/create_database_in_cluster'
      description: Create an in-cluster Mysql database.
    create_mysql_managed_database:
      allOf:
        - $ref: '#/components/schemas/create_database_managed'
      description: Create a managed Mysql database.
    create_mongodb_in_cluster_database:
      allOf:
        - $ref: '#/components/schemas/create_database_in_cluster'
      description: Create an in-cluster Mongodb database.
    create_mongodb_managed_database:
      allOf:
        - $ref: '#/components/schemas/create_database_managed'
      description: Create a managed Mongodb database.
    database_capabilities:
      type: object
      description: Day-2 operations a database offers.
      required:
        - backups
        - point_in_time
      properties:
        backups:
          type: boolean
          description: Backups run. MySQL and MongoDB need a backup bucket.
        point_in_time:
          type: boolean
          description: Any second of the restore window can be restored; otherwise restores go back to a backup.
    database_engine:
      type: object
      description: An engine databases can run, on its operator.
      required:
        - type
        - display_name
        - versions
        - default_version
        - capabilities
      properties:
        type:
          $ref: '#/components/schemas/database_type'
        display_name:
          type: string
        versions:
          type: array
          description: Version lines that can be created, oldest first.
          items:
            type: string
        default_version:
          type: string
          description: Version line a new database runs when none is chosen.
        capabilities:
          $ref: '#/components/schemas/database_capabilities'
    database_backup:
      type: object
      description: One pgBackRest backup of the database.
      required:
        - name
        - type
        - state
        - manual
        - created_at
      properties:
        name:
          type: string
          description: Backup label in the repository, or the request name while it runs.
        type:
          type: string
          description: Backup type (full, diff or incr).
        state:
          type: string
          description: Starting, Running, Succeeded or Failed.
        manual:
          type: boolean
          description: Whether a user asked for this backup.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    database_restore_status:
      type: object
      description: One in-place restore of the database.
      required:
        - name
        - state
        - target
        - created_at
      properties:
        name:
          type: string
        state:
          type: string
        target:
          type: string
          description: Point in time restored.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    database_restore_window:
      type: object
      description: Any second between earliest and latest can be restored.
      required:
        - earliest
        - latest
      properties:
        earliest:
          type: string
          format: date-time
        latest:
          type: string
          format: date-time
    database_backups:
      type: object
      description: Backup timeline of a database.
      required:
        - cluster_state
        - repository_type
        - retention_days
        - schedule
        - capabilities
        - backups
        - restores
      properties:
        cluster_state:
          type: string
          description: State reported by the operator (initializing, ready, paused...).
        repository_type:
          type: string
          description: Where backups are kept, s3 or volume, empty without backups.
        retention_days:
          type: integer
        schedule:
          type: string
          description: Cron schedule of the full backups, in UTC.
        capabilities:
          $ref: '#/components/schemas/database_capabilities'
        backups:
          type: array
          items:
            $ref: '#/components/schemas/database_backup'
        restores:
          type: array
          items:
            $ref: '#/components/schemas/database_restore_status'
        restore_window:
          $ref: '#/components/schemas/database_restore_window'
    database_restore_request:
      type: object
      required:
        - mode
      properties:
        target_time:
          type: string
          format: date-time
          description: Point in time to restore, inside the restore window, for engines that restore any second.
        backup_name:
          type: string
          description: Backup to restore, for engines that restore backups.
        mode:
          type: string
          enum:
            - new_database
            - in_place
          description: Restore into a new database next to this one, or roll this database back.
        name:
          type: string
          description: Name of the new database (new_database mode).
    database_maintenance_window:
      type: object
      description: Weekly window in which Kapten may restart the database to apply security updates.
      required:
        - day_of_week
        - start_hour
        - duration_hours
        - timezone
        - auto_security_updates
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of the week, 0 is Sunday.
        start_hour:
          type: integer
          minimum: 0
          maximum: 23
        duration_hours:
          type: integer
          minimum: 1
          maximum: 8
        timezone:
          type: string
          description: IANA timezone of the window, such as Europe/Paris.
        auto_security_updates:
          type: boolean
          description: Apply the latest patch release of the current major in the window.
    database_release:
      type: object
      required:
        - version
        - tag
        - full_version
      properties:
        version:
          type: string
          description: Version line, such as 17, 8.4 or 7.0.
        tag:
          type: string
          description: Image release, such as 16.15-4 or 8.4.11-11.1.
        full_version:
          type: string
          description: Database version of the image, such as 16.15 or 8.4.11.
    database_upgrade_status:
      type: object
      required:
        - name
        - state
        - from_version
        - to_version
        - created_at
      properties:
        name:
          type: string
        state:
          type: string
        message:
          type: string
        from_version:
          type: string
        to_version:
          type: string
        created_at:
          type: string
          format: date-time
    database_maintenance:
      type: object
      description: Version and maintenance state of a database.
      required:
        - window
        - window_open
        - next_window_start
        - current
        - running_image
        - cluster_state
        - upgrade_versions
        - upgrades
      properties:
        window:
          $ref: '#/components/schemas/database_maintenance_window'
        window_open:
          type: boolean
        next_window_start:
          type: string
          format: date-time
        current:
          $ref: '#/components/schemas/database_release'
        running_image:
          type: string
        cluster_state:
          type: string
        available_update:
          $ref: '#/components/schemas/database_release'
        upgrade_versions:
          type: array
          description: Version lines the database can be upgraded to.
          items:
            type: string
        upgrades:
          type: array
          items:
            $ref: '#/components/schemas/database_upgrade_status'
    database_upgrade_request:
      type: object
      properties:
        target_version:
          type: string
          description: Version line to upgrade to. Without it, the pending patch release of the current line is applied now.
    database_upgrade_response:
      type: object
      properties:
        component_run:
          $ref: '#/components/schemas/component_run'
    environment_usage:
      type: object
      required:
        - environment_id
        - project_id
        - active_seconds
        - billable_minutes
      properties:
        environment_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        active_seconds:
          type: number
          format: double
          description: Active time in the period, in seconds, to the millisecond.
        billable_minutes:
          type: integer
          format: int64
          description: Minutes billed for the period. In each UTC hour, the environment counts the minutes it started, so ten seconds bill one minute.
    environment_usage_day:
      type: object
      required:
        - day
        - billable_minutes
      properties:
        day:
          type: string
          format: date-time
          description: Start of the UTC day.
        billable_minutes:
          type: integer
          format: int64
          description: Minutes billed for the day, over every environment of the organization.
    environment_usage_report:
      type: object
      required:
        - since
        - until
        - closed_through
        - environments
        - days
      properties:
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        closed_through:
          type: string
          format: date-time
          description: End of the last closed hour; later hours are not counted yet.
        environments:
          type: array
          items:
            $ref: '#/components/schemas/environment_usage'
        days:
          type: array
          description: Billable minutes per UTC day, for the days of the period with usage, in order. They add up to the environments' billable minutes.
          items:
            $ref: '#/components/schemas/environment_usage_day'
  responses:
    error_response:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  headers:
    cache_control_no_store:
      description: Prevents storage of GitHub integration response data.
      schema:
        type: string
        enum:
          - no-store
    location:
      description: Absolute URL the client is redirected to.
      required: true
      schema:
        type: string
        format: uri
    retry_after:
      description: Safe retry delay in seconds or an HTTP date when known.
      schema:
        type: string
