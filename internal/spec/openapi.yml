      type: string
      description: Application port protocol.
      enum:
        - HTTP
        - GRPC
        - TCP
        - UDP
    application_container_source:
      type: object
      description: Explicit container image source for an application.
      additionalProperties: false
      required:
        - type
        - image_name
        - tag
      properties:
        type:
          type: string
          enum:
            - container
          description: Container source discriminator.
        image_name:
          type: string
          minLength: 1
          pattern: \S
          description: image name
        tag:
          type: string
          minLength: 1
          pattern: \S
          description: tag of the image container
    application_github_source_input:
      type: object
      description: GitHub repository source submitted by a client for live validation.
      additionalProperties: false
      required:
        - type
        - installation_id
        - repository_id
        - branch
        - build_policy
      properties:
        type:
          type: string
          enum:
            - github
        installation_id:
          $ref: '#/components/schemas/uuid'
        repository_id:
          type: string
          pattern: ^[1-9][0-9]*$
        branch:
          type: string
          minLength: 1
        trigger_policy:
          type: object
          additionalProperties: false
          properties:
            automatic:
              type: boolean
              default: true
            path_mode:
              type: string
              description: Controls whether changed repository paths include or exclude an automatic build.
              enum:
                - none
                - include
                - exclude
              default: none
            paths:
              type: array
              description: Repository-relative, case-sensitive patterns used by the selected path mode.
              default: []
              maxItems: 50
              items:
                type: string
                maxLength: 512
        build_policy:
          type: object
          additionalProperties: false
          required:
            - cpu_request_in_milli
            - cpu_limit_in_milli
            - ram_request_in_mib
            - ram_limit_in_mib
          properties:
            context:
              type: string
              default: .
            cpu_request_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
              example: 1000m
            cpu_limit_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
              example: 2000m
            ram_request_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
              example: 1024Mi
            ram_limit_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
              example: 2048Mi
            timeout_seconds:
              type: integer
              minimum: 60
              maximum: 7200
              default: 3600
    application_github_source:
      type: object
      description: The GitHub source of an application, with the repository details Kapten read from GitHub.
      additionalProperties: false
      required:
        - type
        - installation_id
        - repository_id
        - repository_owner
        - repository_name
        - repository_full_name
        - repository_private
        - repository_archived
        - repository_default_branch
        - branch
        - availability
        - trigger_policy
        - build_policy
      properties:
        type:
          type: string
          enum:
            - github
        installation_id:
          $ref: '#/components/schemas/uuid'
        repository_id:
          type: string
          pattern: ^[1-9][0-9]*$
        repository_owner:
          type: string
        repository_name:
          type: string
        repository_full_name:
          type: string
        repository_private:
          type: boolean
        repository_archived:
          type: boolean
        repository_default_branch:
          type: string
        branch:
          type: string
        availability:
          type: string
          description: Live, response-only attention state for the exact configured source identity.
          enum:
            - available
            - installation_suspended
            - installation_deleted
            - repository_unavailable
            - branch_unavailable
            - github_unavailable
        trigger_policy:
          type: object
          additionalProperties: false
          required:
            - automatic
            - path_mode
            - paths
          properties:
            automatic:
              type: boolean
            path_mode:
              type: string
              enum:
                - none
                - include
                - exclude
            paths:
              type: array
              maxItems: 50
              items:
                type: string
                maxLength: 512
        build_policy:
          type: object
          additionalProperties: false
          required:
            - context
            - cpu_request_in_milli
            - cpu_limit_in_milli
            - ram_request_in_mib
            - ram_limit_in_mib
            - timeout_seconds
          properties:
            context:
              type: string
            cpu_request_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
            cpu_limit_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
            ram_request_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
            ram_limit_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
            timeout_seconds:
              type: integer
              minimum: 60
              maximum: 7200
