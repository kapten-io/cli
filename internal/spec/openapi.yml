          type: string
          description: The domain.
        port_id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: The public port the domain routes to.
        status:
          $ref: '#/components/schemas/application_domain_status'
        status_reason:
          type: string
          description: Why the domain is not verified yet, or why it failed. Empty once verified.
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: When Kapten saw the DNS record point at the cluster.
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: When Kapten last looked for the DNS record.
        created_at:
          type: string
          format: date-time
    application_domain_list:
      type: object
      required:
        - domains
        - target
      properties:
        target:
          type: string
          nullable: true
          description: 'The value of the CNAME record each domain needs, the application''s cluster name. Null while the cluster has no domain: custom domains cannot be verified then.'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/application_domain'
    application_domain_status:
      type: string
      enum:
        - PENDING_DNS
        - VERIFIED
        - ERROR
      description: 'PENDING_DNS: Kapten is looking for the DNS record. VERIFIED: the record points at the cluster; the application serves the domain from its next deployment. ERROR: the domain cannot be verified, see `status_reason`.'
    add_application_domain:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
          maxLength: 253
          description: The domain, such as `www.example.com`. Apex and wildcard domains are not supported, nor domains under Kapten's own.
        port_id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: The public port the domain routes to. Defaults to the default port, or else the first public port.
    application_storage:
      type: object
      required:
        - name
        - mount_path
        - size_in_gib
        - storage_type
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: Human-readable storage name.
        mount_path:
          type: string
          description: Absolute path mounted into the application.
        size_in_gib:
          type: integer
          minimum: 1
          description: Persistent volume size in GiB.
        storage_type:
          type: string
          description: Kubernetes storage class name.
    application_protocol:
      type: string
      description: Application port protocol. HTTP serves HTTP/1.1, websockets included; GRPC serves HTTP/2 without TLS (h2c) to the container, for gRPC.
      enum:
        - HTTP
        - GRPC
        - TCP
        - UDP
    application_container_source:
      type: object
      description: Explicit container image source for an application.
      additionalProperties: false
      required:
        - type
        - image_name
        - tag
      properties:
        type:
          type: string
          enum:
            - container
          description: Container source discriminator.
        image_name:
          type: string
          minLength: 1
          pattern: \S
          description: image name
        tag:
          type: string
          minLength: 1
          pattern: \S
          description: tag of the image container
    application_github_source_input:
      type: object
      description: GitHub repository source submitted by a client for live validation.
      additionalProperties: false
      required:
        - type
        - installation_id
        - repository_id
        - branch
        - build_policy
      properties:
        type:
          type: string
          enum:
            - github
        installation_id:
          $ref: '#/components/schemas/uuid'
        repository_id:
          type: string
          pattern: ^[1-9][0-9]*$
        branch:
          type: string
          minLength: 1
        trigger_policy:
          type: object
          additionalProperties: false
          properties:
            automatic:
              type: boolean
              default: true
            path_mode:
              type: string
              description: Controls whether changed repository paths include or exclude an automatic build.
              enum:
                - none
                - include
                - exclude
              default: none
            paths:
              type: array
              description: Repository-relative, case-sensitive patterns used by the selected path mode.
              default: []
              maxItems: 50
              items:
                type: string
                maxLength: 512
        build_policy:
          type: object
          additionalProperties: false
          required:
            - cpu_request_in_milli
            - cpu_limit_in_milli
            - ram_request_in_mib
            - ram_limit_in_mib
          properties:
            pool:
              type: string
              description: Optional build workload pool. Empty uses the cluster default; kapten is reserved.
            context:
              type: string
              default: .
            cpu_request_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
              example: 1000m
            cpu_limit_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
              example: 2000m
            ram_request_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
              example: 1024Mi
            ram_limit_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
              example: 2048Mi
            timeout_seconds:
              type: integer
              minimum: 60
              maximum: 7200
              default: 3600
        build_registry_id:
          description: Organization container registry that builds push to. Omitted, builds push to the built-in registry of the application's cluster.
          $ref: '#/components/schemas/uuid'
    application_github_source:
      type: object
      description: The GitHub source of an application, with the repository details Kapten read from GitHub.
      additionalProperties: false
      required:
        - type
        - installation_id
        - repository_id
        - repository_owner
        - repository_name
        - repository_full_name
        - repository_private
        - repository_archived
        - repository_default_branch
        - branch
        - availability
        - trigger_policy
        - build_policy
      properties:
        type:
          type: string
          enum:
            - github
        installation_id:
          $ref: '#/components/schemas/uuid'
        repository_id:
          type: string
          pattern: ^[1-9][0-9]*$
        repository_owner:
          type: string
        repository_name:
          type: string
        repository_full_name:
          type: string
        repository_private:
          type: boolean
        repository_archived:
          type: boolean
        repository_default_branch:
          type: string
        branch:
          type: string
        availability:
          type: string
          description: Live, response-only attention state for the exact configured source identity.
          enum:
            - available
            - installation_suspended
            - installation_deleted
            - repository_unavailable
            - branch_unavailable
            - github_unavailable
        trigger_policy:
          type: object
          additionalProperties: false
          required:
            - automatic
            - path_mode
            - paths
          properties:
            automatic:
              type: boolean
            path_mode:
              type: string
              enum:
                - none
                - include
                - exclude
            paths:
              type: array
              maxItems: 50
              items:
                type: string
                maxLength: 512
        build_policy:
          type: object
          additionalProperties: false
          required:
            - context
            - cpu_request_in_milli
            - cpu_limit_in_milli
            - ram_request_in_mib
            - ram_limit_in_mib
            - timeout_seconds
          properties:
            pool:
              type: string
              description: Optional build workload pool. Empty uses the cluster default; kapten is reserved.
            context:
              type: string
            cpu_request_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
            cpu_limit_in_milli:
              type: string
              pattern: ^[1-9][0-9]*m$
            ram_request_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
            ram_limit_in_mib:
              type: string
              pattern: ^[1-9][0-9]*Mi$
            timeout_seconds:
              type: integer
              minimum: 60
              maximum: 7200
        build_registry_id:
          description: Organization container registry that builds push to. Omitted, builds push to the built-in registry of the application's cluster.
          $ref: '#/components/schemas/uuid'
    database_type:
      type: string
      description: Database engine type.
      enum:
        - POSTGRESQL
        - MYSQL
        - MONGODB
    database_provisioning:
      type: string
      description: Database provisioning strategy.
      enum:
        - IN_CLUSTER
        - MANAGED
    database_accessibility:
      type: string
      description: Database network accessibility.
      enum:
        - PRIVATE
        - PUBLIC
    database_deployment_state:
      type: string
      description: Last deployment state for the database resource.
      enum:
        - QUEUED
        - SCHEDULED
        - RUNNING
        - RETRYING
        - SUCCEEDED
        - FAILED
        - CANCELED
        - TIMED_OUT
        - SKIPPED
        - NONE
    database_resource_state:
      type: string
      description: Current resource state for the database resource.
      enum:
        - OUT_OF_DATE
        - UP_TO_DATE
        - NEVER_DEPLOYED
    database:
      type: object
      required:
        - id
        - organization_id
        - project_id
        - cluster_id
        - environment_id
        - s_id
        - name
        - type
        - version
        - provisioning
        - accessibility
        - configuration
        - created_at
        - updated_at
        - resource_state
        - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        organization_id:
          $ref: '#/components/schemas/uuid'
        project_id:
          $ref: '#/components/schemas/uuid'
        cluster_id:
          $ref: '#/components/schemas/uuid'
        environment_id:
          $ref: '#/components/schemas/uuid'
        s_id:
          type: string
          description: Short identifier for the database resource.
        name:
          type: string
          description: Name of the database.
        description:
          type: string
          description: Optional database description.
        type:
          allOf:
            - $ref: '#/components/schemas/database_type'
          description: Database engine type.
        version:
          type: string
          description: Database engine version.
        provisioning:
          allOf:
            - $ref: '#/components/schemas/database_provisioning'
          description: Database provisioning strategy.
        accessibility:
          allOf:
            - $ref: '#/components/schemas/database_accessibility'
          description: Database network accessibility.
        configuration:
          type: object
          required:
            - resources
          properties:
            pool:
              type: string
              description: Optional workload pool. Omit or use an empty string for the cluster default; kapten is reserved.
            database_name:
              type: string
              description: Logical database name created inside the engine.
            encrypt_disk:
              type: boolean
            activate_high_availability:
              type: boolean
            activate_backups:
              type: boolean
            resources:
              type: object
              properties:
                cpu_request_in_milli:
                  type: integer
                  format: int64
                  minimum: 0
                cpu_limit_in_milli:
                  type: integer
                  format: int64
                  minimum: 0
                ram_request_in_mib:
                  type: integer
                  format: int64
                  minimum: 0
                ram_limit_in_mib:
                  type: integer
                  format: int64
                  minimum: 0
                disk_size_in_gib:
                  type: integer
                  format: int64
                  minimum: 0
                database_instance_tier:
                  type: string
                database_disk_type:
                  type: string
                database_disk_iops:
                  type: integer
                  format: int64
                  minimum: 0
        created_at:
          type: string
          format: date-time
          description: Timestamp when the database was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the database was last updated.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the database was deleted.
        last_run_id:
          $ref: '#/components/schemas/uuid'
          nullable: true
          description: Last component run identifier.
        last_run_status:
          $ref: '#/components/schemas/component_deployment_state'
          nullable: true
          description: Last component run status for the database.
        resource_state:
          allOf:
            - $ref: '#/components/schemas/database_resource_state'
          description: Current resource state for the database.
    update_database:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Updated database name.
        description:
          type: string
          description: Updated database description.
        version:
          type: string
          description: Updated database engine version.
        accessibility:
          allOf:
            - $ref: '#/components/schemas/database_accessibility'
          description: Updated database network accessibility.
        configuration:
          type: object
          properties:
            pool:
              type: string
              description: Optional workload pool. Omit or use an empty string for the cluster default; kapten is reserved.
            encrypt_disk:
              type: boolean
            activate_high_availability:
              type: boolean
            activate_backups:
              type: boolean
            resources:
              type: object
              properties:
                cpu_request_in_milli:
                  type: integer
                  format: int64
                  minimum: 0
                cpu_limit_in_milli:
                  type: integer
                  format: int64
                  minimum: 0
                ram_request_in_mib:
                  type: integer
                  format: int64
                  minimum: 0
                ram_limit_in_mib:
                  type: integer
                  format: int64
                  minimum: 0
                disk_size_in_gib:
                  type: integer
                  format: int64
                  minimum: 0
                database_instance_tier:
                  type: string
                database_disk_type:
                  type: string
                database_disk_iops:
                  type: integer
                  format: int64
                  minimum: 0
    create_postgresql_database:
      oneOf:
        - $ref: '#/components/schemas/create_postgresql_in_cluster_database'
        - $ref: '#/components/schemas/create_postgresql_managed_database'
      discriminator:
        propertyName: provisioning
        mapping:
          IN_CLUSTER: '#/components/schemas/create_postgresql_in_cluster_database'
          MANAGED: '#/components/schemas/create_postgresql_managed_database'
    create_mysql_database:
      oneOf:
        - $ref: '#/components/schemas/create_mysql_in_cluster_database'
        - $ref: '#/components/schemas/create_mysql_managed_database'
      discriminator:
        propertyName: provisioning
        mapping:
          IN_CLUSTER: '#/components/schemas/create_mysql_in_cluster_database'
          MANAGED: '#/components/schemas/create_mysql_managed_database'
    create_mongodb_database:
      oneOf:
        - $ref: '#/components/schemas/create_mongodb_in_cluster_database'
        - $ref: '#/components/schemas/create_mongodb_managed_database'
      discriminator:
        propertyName: provisioning
        mapping:
          IN_CLUSTER: '#/components/schemas/create_mongodb_in_cluster_database'
          MANAGED: '#/components/schemas/create_mongodb_managed_database'
    cache:
      type: object
      required:
        - id
        - organization_id
        - project_id
        - cluster_id
        - environment_id
        - s_id
        - name
        - engine
        - version
        - patch_version
        - mode
        - high_availability
        - memory_mib
        - cpu_milli
        - connection
        - maintenance_window
        - created_at
        - updated_at
        - resource_state
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        organization_id:
          $ref: '#/components/schemas/uuid'
        project_id:
          $ref: '#/components/schemas/uuid'
        cluster_id:
          $ref: '#/components/schemas/uuid'
        environment_id:
          $ref: '#/components/schemas/uuid'
        s_id:
          type: string
          description: Short identifier for the cache.
        name:
          type: string
          description: Name of the cache.
        description:
          type: string
          description: Optional cache description.
        engine:
          type: string
          description: Cache engine, currently always Valkey.
        version:
          type: string
          description: Version line, such as 9.0.
        patch_version:
          type: string
          description: Release the cache runs, such as 9.0.7.
        mode:
          $ref: '#/components/schemas/cache_mode'
        high_availability:
          type: boolean
          description: Whether a replica takes over when the primary fails.
        memory_mib:
          type: integer
          format: int64
          description: Memory the cache may use for keys, in MiB.
        cpu_milli:
          type: integer
          format: int64
          description: CPU reserved for each node, in thousandths of a core.
        disk_size_gib:
          type: integer
          format: int64
          description: Size of the volume of a persistent cache, in GiB.
        maintenance_window:
          $ref: '#/components/schemas/cache_maintenance_window'
        connection:
          $ref: '#/components/schemas/cache_connection'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        last_run_id:
          $ref: '#/components/schemas/uuid'
          nullable: true
          description: Last component run identifier.
        last_run_status:
          $ref: '#/components/schemas/component_deployment_state'
          nullable: true
          description: Last component run status for the cache.
        resource_state:
          $ref: '#/components/schemas/component_resource_state'
    create_cache:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Name of the cache, unique in its environment.
        description:
          type: string
        version:
          type: string
          description: Version line, such as 9.0. The newest line when omitted.
        mode:
          $ref: '#/components/schemas/cache_mode'
        high_availability:
          type: boolean
          description: Run a replica that takes over when the primary fails.
        memory_mib:
          type: integer
          format: int64
          minimum: 64
          description: Memory the cache may use for keys, in MiB. 256 when omitted.
        cpu_milli:
          type: integer
          format: int64
          minimum: 0
          description: CPU reserved for each node, in thousandths of a core. 250 when omitted.
        disk_size_gib:
          type: integer
          format: int64
          minimum: 0
          description: Volume size of a persistent cache, in GiB, at least twice the memory.
    update_cache:
      type: object
      description: The fields of a cache that can change. The mode and version line cannot.
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
        description:
          type: string
        high_availability:
          type: boolean
        memory_mib:
          type: integer
          format: int64
          minimum: 64
        cpu_milli:
          type: integer
          format: int64
          minimum: 0
        disk_size_gib:
          type: integer
          format: int64
          minimum: 0
          description: New volume size of a persistent cache; a volume can only grow.
    cache_mode:
      type: string
      description: |
        How a cache treats its data. `cache` keeps keys in memory only and evicts the least recently used keys when memory is full. `persistent` writes every change to an append-only file on a volume and refuses writes when memory is full. The mode is chosen at creation and cannot change.
      enum:
        - cache
        - persistent
    cache_engine:
      type: object
      description: An engine caches can run.
      required:
        - display_name
        - versions
        - default_version
      properties:
        display_name:
          type: string
        versions:
          type: array
          description: Version lines that can be created, oldest first.
          items:
            type: string
        default_version:
          type: string
          description: Version line a new cache runs when none is chosen.
    cache_maintenance_window:
      type: object
      description: Weekly window in which Kapten may restart the cache to apply patch releases.
      required:
        - day_of_week
        - start_hour
        - duration_hours
        - timezone
        - auto_security_updates
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of the week, 0 is Sunday.
        start_hour:
          type: integer
          minimum: 0
          maximum: 23
        duration_hours:
          type: integer
          minimum: 1
          maximum: 8
        timezone:
          type: string
          description: IANA timezone of the window, such as Europe/Paris.
        auto_security_updates:
          type: boolean
          description: Apply the latest patch release of the current version line in the window.
    cache_connection:
      type: object
      description: Where applications reach a cache inside its cluster. The password is a secret variable of the cache.
      required:
        - host
        - port
        - username
      properties:
        host:
          type: string
          description: Cluster-internal host name of the cache.
        port:
          type: integer
          description: Port the cache listens on.
        username:
          type: string
          description: User applications connect as.
    cache_release:
      type: object
      required:
        - version
        - tag
      properties:
        version:
          type: string
          description: Version line, such as 9.0.
        tag:
          type: string
          description: Valkey release of the image, such as 9.0.7.
    cache_maintenance:
      type: object
      description: Version and maintenance state of a cache.
      required:
        - window
        - window_open
        - next_window_start
        - current
        - upgrade_versions
        - deploying
      properties:
        window:
          $ref: '#/components/schemas/cache_maintenance_window'
        window_open:
          type: boolean
        next_window_start:
          type: string
          format: date-time
        current:
          $ref: '#/components/schemas/cache_release'
        available_update:
          $ref: '#/components/schemas/cache_release'
        upgrade_versions:
          type: array
          description: Version lines the cache can be upgraded to, one line at a time.
          items:
            type: string
        deploying:
          type: boolean
          description: A deployment of the cache is running; updates wait for it.
    cache_upgrade_request:
      type: object
      properties:
        target_version:
          type: string
          description: Version line to upgrade to. Without it, the latest patch release of the current line is applied now.
    cache_upgrade_response:
      type: object
      required:
        - component_run
      properties:
        component_run:
          $ref: '#/components/schemas/component_run'
    healthcheck:
      type: object
      description: Configuration object for health check probes including readiness and liveness probe settings
      nullable: false
      properties:
        readiness_probe:
          $ref: '#/components/schemas/probe'
        liveness_probe:
          $ref: '#/components/schemas/probe'
    probe:
      type: object
      description: Configuration for health check probes used to determine the health status of a container or service. Supports multiple probe types including TCP, HTTP, exec command, and gRPC.
      nullable: true
      properties:
        type:
          type: object
          properties:
            tcp:
              type: object
              nullable: true
              properties:
                port:
                  type: integer
                host:
                  type: string
                  default: null
                  nullable: true
            http:
              type: object
              nullable: true
              properties:
                path:
                  type: string
                  default: /
                scheme:
                  type: string
                  default: HTTP
                port:
                  type: integer
            exec:
              type: object
              nullable: true
              properties:
                command:
                  type: array
                  items:
                    type: string
            grpc:
              type: object
              nullable: true
              properties:
                service:
                  type: string
                  nullable: true
                  default: null
                port:
                  type: integer
        initial_delay_seconds:
          type: integer
          default: 30
        period_seconds:
          type: integer
          default: 10
        timeout_seconds:
          type: integer
          default: 5
        success_threshold:
          type: integer
          default: 1
        failure_threshold:
          type: integer
          default: 9
    container_image_source:
      type: object
      description: Container image configuration object that specifies the image name and tag for deployment or job
      required:
        - image_name
        - tag
      properties:
        image_name:
          type: string
          minLength: 1
          pattern: \S
          description: image name
        tag:
          type: string
          minLength: 1
          pattern: \S
          description: tag of the image container
    variable:
      type: object
      required:
        - id
        - organization_id
        - project_id
        - visibility
        - var_type
        - key
        - is_secret
        - managed
        - created_at
        - updated_at
        - value
        - file_path
        - component_kind
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        organization_id:
          $ref: '#/components/schemas/uuid'
        project_id:
          $ref: '#/components/schemas/uuid'
        environment_id:
          $ref: '#/components/schemas/uuid'
          nullable: true
        visibility:
          $ref: '#/components/schemas/variable_visibility'
        var_type:
          $ref: '#/components/schemas/variable_type'
        key:
          type: string
          description: Variable key identifier.
        is_secret:
          type: boolean
          description: Indicates whether the value is stored in Vault.
        managed:
          type: boolean
          description: Indicates whether the variable is managed by the engine and cannot be updated or deleted through the API.
        value:
          type: string
          nullable: true
          description: Variable value. Null for secret variables.
        file_path:
          type: string
          nullable: true
          description: Absolute file path for file variables.
        component_kind:
          allOf:
            - $ref: '#/components/schemas/component_kind'
