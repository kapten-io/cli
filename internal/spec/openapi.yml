        type: string
        format: date-time
    component_run_created_before:
      name: created_before
      in: query
      description: Filter component runs created at or before this timestamp.
      required: false
      schema:
        type: string
        format: date-time
    include_inherited:
      name: include_inherited
      in: query
      description: Include inherited records from project and environment scopes.
      required: false
      schema:
        type: boolean
        default: false
    audit_action:
      name: action
      in: query
      description: Only events with one of these actions.
      schema:
        type: array
        maxItems: 20
        items:
          type: string
      style: form
      explode: true
    audit_actor_id:
      name: actor_id
      in: query
      description: Only events by this user or client, or that the system recorded on their behalf (`metadata.initiated_by`).
      schema:
        type: string
    audit_target_type:
      name: target_type
      in: query
      description: With `target_id`, only events about this object, as their primary target or an ancestor of it.
      schema:
        type: string
    audit_target_id:
      name: target_id
      in: query
      schema:
        type: string
        format: uuid
    audit_affected_user_id:
      name: affected_user_id
      in: query
      schema:
        type: string
        format: uuid
    audit_outcome:
      name: outcome
      in: query
      schema:
        type: string
        enum:
          - allowed
          - denied
    audit_changed_field:
      name: changed_field
      in: query
      description: Only events that changed this field.
      schema:
        type: string
    audit_since:
      name: since
      in: query
      description: Only events at or after this time.
      schema:
        type: string
        format: date-time
    audit_until:
      name: until
      in: query
      description: Only events before this time.
      schema:
        type: string
        format: date-time
    audit_cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
    audit_limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    metrics_range:
      name: range
      in: query
      required: false
      description: How far back the metrics go. Defaults to 1h.
      schema:
        $ref: '#/components/schemas/metrics_range'
    job_id:
      name: job_id
      in: path
      required: true
      description: The unique identifier for the job
      schema:
        $ref: '#/components/schemas/uuid'
    github_installation_id:
      name: installation_id
      in: path
      required: true
      description: Kapten UUID of the GitHub installation binding.
      schema:
        $ref: '#/components/schemas/uuid'
    github_page:
      name: page
      in: query
      required: false
      description: One-based GitHub page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    github_per_page:
      name: per_page
      in: query
      required: false
      description: Number of GitHub records returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    github_repository_id:
      name: repository_id
      in: path
      required: true
      description: Immutable GitHub repository ID encoded as a decimal string.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
  schemas:
    cluster:
      type: object
      required:
        - id
        - organization_id
        - name
        - cloud_provider
        - state
        - created_at
        - update_at
        - deleted_at
        - backup_destination
        - domain
        - gateway_addresses
        - builtin_registry
      properties:
        revision:
          $ref: '#/components/schemas/ClusterRevision'
          description: Latest admitted provisioning revision, populated by the cluster detail endpoint when available.
        id:
          $ref: '#/components/schemas/uuid'
        organization_id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: The name of the cluster.
        cloud_provider:
          $ref: '#/components/schemas/cloud_provider'
        state:
          $ref: '#/components/schemas/cluster_state'
        builtin_registry:
          type: boolean
          description: Whether the cluster runs its built-in container registry, which receives the images built from GitHub sources. On by default.
        created_at:
          type: string
          format: date-time
          description: The timestamp when the cluster was created.
        update_at:
          type: string
          format: date-time
          description: The timestamp when the cluster was last updated.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when the cluster was deleted updated.
        backup_destination:
          allOf:
            - $ref: '#/components/schemas/cluster_backup_destination'
          nullable: true
          description: Where the cluster's databases write their backups, or null when they have nowhere to.
        domain:
          type: string
          nullable: true
          description: The DNS name under which applications of this cluster get their default domain (`<application>.<domain>`). Null when the Engine has no apps domain configured.
        gateway_addresses:
          type: array
          items:
            type: string
          description: The public addresses of the cluster's shared gateway, as last reported by the agent. Empty until the gateway gets a public address.
      example:
        backup_destination: null
        cloud_provider: aws
        created_at: '2025-06-10T22:16:02Z'
        deleted_at: '2025-06-10T22:16:02Z'
        domain: c3f9a1b2c4d.kaptn.cloud
        gateway_addresses:
          - 203.0.113.10
        id: 7362e0d0-72ed-c77b-5c42-f9af9d52fd5f
        name: zKC
        organization_id: 7a60f26d-0106-02f5-ccf5-98b7c4cdc513
        state: INITIALIZED
        builtin_registry: true
        update_at: '2025-06-10T22:16:02Z'
    cluster_state:
      type: string
      enum:
        - UNKOWN
        - READY
        - DEPLOYED
        - DEPLOYING
        - DEPLOY_QUEUED
        - DEPLOY_ERROR
        - INITIALIZING
        - INITIALIZED
        - INITIALIZE_QUEUED
        - INITIALIZE_ERROR
        - STOPED
        - STOPING
        - STOP_QUEUED
        - STOP_ERROR
        - RESTART
        - RESTARTING
        - RESTART_QUEUED
        - RESTART_ERROR
      description: The current lifecycle state of the cluster.
    cluster_registry_health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - READY
            - NOT_READY
            - UNKNOWN
          description: READY when the registry and the proxy on every node are ready; UNKNOWN when the cluster could not be reached.
        reason:
          type: string
          description: Why the registry is not ready, when it is not.
    create_cluster_dto:
      $ref: '#/components/schemas/EnrollClusterInput'
    update_cluster_dto:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: The name of the cluster.
        builtin_registry:
          type: boolean
          description: Turns the cluster's built-in container registry on or off, which reconciles the cluster. Turning it off is refused while applications of the cluster use it, and keeps its stored images for when it is turned on again. The change is refused while another operation of the cluster is in progress.
      example:
        name: my-production-cluster
    cluster_backup_destination:
      type: object
      description: Where the cluster's databases write their backups. The keys are never returned.
      properties:
        s3:
          $ref: '#/components/schemas/s3_backup_destination'
      example:
        s3:
          endpoint: https://s3.fr-par.scw.cloud
          bucket: my-backups
          region: fr-par
          uri_style: host
          verify_tls: true
    s3_backup_destination:
      type: object
      description: An S3-compatible bucket. Each database writes under its own prefix.
      required:
        - endpoint
        - bucket
        - uri_style
        - verify_tls
      properties:
        endpoint:
          type: string
          description: The http or https URL of the S3 API, without a path.
        bucket:
          type: string
          description: The bucket backups are written to.
        region:
          type: string
          description: The bucket's region, when the store needs one.
        uri_style:
          $ref: '#/components/schemas/s3_uri_style'
        verify_tls:
          type: boolean
          description: Whether the endpoint's TLS certificate is verified.
    s3_uri_style:
      type: string
      description: How the bucket is addressed, in the host name (host) or in the path (path).
      enum:
        - host
        - path
    set_cluster_backup_destination_dto:
      type: object
      required:
        - s3
      properties:
        s3:
          type: object
          required:
            - endpoint
            - bucket
          properties:
            endpoint:
              type: string
              minLength: 1
              description: The http or https URL of the S3 API, without a path.
            bucket:
              type: string
              minLength: 1
              description: The bucket backups are written to.
            region:
              type: string
              description: The bucket's region, when the store needs one.
            uri_style:
              $ref: '#/components/schemas/s3_uri_style'
            verify_tls:
              type: boolean
              default: true
              description: Whether the endpoint's TLS certificate is verified.
            access_key_id:
              type: string
              description: The access key. Leave it out with the secret key to keep the stored keys.
            secret_access_key:
              type: string
              format: password
              description: The secret key. Leave it out with the access key to keep the stored keys.
      example:
        s3:
          endpoint: https://s3.fr-par.scw.cloud
          bucket: my-backups
          region: fr-par
          uri_style: host
          verify_tls: true
          access_key_id: SCWXXXXXXXXXXXXXXXXX
          secret_access_key: 00000000-0000-0000-0000-000000000000
    cluster_network:
      type: object
      required:
        - id
        - cluster_id
        - name
        - kind
        - service_type
        - load_balancer_class
        - annotations
        - addresses
        - status
        - status_reason
        - supported_features
        - reported_at
        - gateway_namespace
        - gateway_name
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        cluster_id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: The network's name, a DNS label that appears in its hostnames.
        kind:
          $ref: '#/components/schemas/cluster_network_kind'
        service_type:
          $ref: '#/components/schemas/cluster_network_service_type'
        load_balancer_class:
          type: string
          description: The Envoy Service's load balancer class, for a managed network.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: The Envoy Service's annotations, for a managed network.
        addresses:
          type: array
          items:
            type: string
          description: The addresses of the network's Gateway, as the agent last reported them.
        status:
          $ref: '#/components/schemas/cluster_network_status'
        status_reason:
          type: string
          description: Why the network is not ready. Empty once ready.
        supported_features:
          type: array
          items:
            type: string
          description: The Gateway API features of the network's GatewayClass, such as `HTTPRoute`, as it reports them.
        reported_at:
          type: string
          format: date-time
          nullable: true
          description: When the agent last reported the network.
        gateway_namespace:
          type: string
          description: The namespace of the network's Gateway; empty while an external network has none.
        gateway_name:
          type: string
          description: The name of the network's Gateway, which application routes attach to.
        created_at:
          type: string
          format: date-time
    cluster_network_list:
      type: object
      required:
        - networks
      properties:
        networks:
          type: array
          items:
            $ref: '#/components/schemas/cluster_network'
    cluster_network_kind:
      type: string
      description: 'Who creates the network''s Gateway: `PUBLIC` is the cluster''s shared Gateway on the internet, `MANAGED` a Gateway Kapten creates for the network, `EXTERNAL` a Gateway the customer runs and labels `kapten.io/network`.'
      enum:
        - PUBLIC
        - MANAGED
        - EXTERNAL
    cluster_network_status:
      type: string
      description: '`PENDING` until the cluster''s agent reports the Gateway, `READY` once it is programmed and has an address, `UNAVAILABLE` when it is missing or not programmed.'
      enum:
        - PENDING
        - READY
        - UNAVAILABLE
    cluster_network_service:
      type: object
      description: The Envoy Service in front of a managed network's Gateway.
      properties:
        service_type:
          $ref: '#/components/schemas/cluster_network_service_type'
        load_balancer_class:
          type: string
          maxLength: 253
          description: The `loadBalancerClass` of the Service, such as `tailscale`. Only with the `LOAD_BALANCER` type. Empty uses the cluster's default load balancer.
        annotations:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 4096
          description: 'Annotations of the Service, such as `netbird.io/expose: "true"` or a cloud provider''s internal load balancer annotation.'
    cluster_network_service_type:
      type: string
      description: 'The type of the Envoy Service: `LOAD_BALANCER` asks the cluster for a load balancer, the default one or the one named by `load_balancer_class`; `CLUSTER_IP` keeps the Service inside the cluster, for an operator that exposes it, such as NetBird''s.'
      enum:
        - LOAD_BALANCER
        - CLUSTER_IP
      default: LOAD_BALANCER
    create_cluster_network:
      allOf:
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              maxLength: 32
              pattern: ^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$
              description: The network's name, a DNS label that appears in its hostnames, such as `tailnet`. It never changes. `public` is reserved.
        - $ref: '#/components/schemas/cluster_network_service'
    error:
      type: object
      description: An error response object containing a status code and descriptive message
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        reason:
          type: string
          description: Optional stable machine-readable reason for programmatic error handling
    logs_query_request:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The user-provided LogsQL query fragment.
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 200
          description: Maximum number of most recent log entries to return.
    logs_query_entry:
      type: object
      required:
        - msg
        - time
      properties:
        msg:
          description: The normalized log payload as an arbitrary JSON value.
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
            - type: number
            - type: boolean
            - type: array
              items: {}
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
        time:
          type: string
          description: The RFC3339 or RFC3339Nano timestamp returned by Victoria Logs.
        level:
          type: string
          description: The log level, or an empty string when missing from the source record.
        project_id:
          type: string
          description: The Kapten project identifier associated with the log entry when present in the source record.
        environment_id:
          type: string
          description: The Kapten environment identifier associated with the log entry when present in the source record.
        component_id:
          type: string
          description: The Kapten component identifier associated with the log entry when present in the source record.
        component_type:
          type: string
          description: The Kapten component type associated with the log entry when present in the source record.
        component_run_id:
          type: string
        component_kind:
          type: string
        source:
          type: string
          enum:
            - control_plane
            - agent
            - builder
        step:
          type: string
        phase:
          type: string
        backend:
          type: string
        backend_step:
          type: string
        run_status:
          type: string
        duration_ms:
          type: integer
          format: int64
        error_kind:
          type: string
        metadata:
          type: object
          additionalProperties: true
        event:
          type: string
          enum:
            - kapten.build.phase
        event_version:
          type: integer
          format: int32
        platform:
          type: string
          enum:
            - linux/amd64
            - linux/arm64
        publication:
          type: string
          enum:
            - child_manifest
            - final_index
    logs_query_response:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/logs_query_entry'
    metrics_range:
      type: string
      description: A time range ending now.
      enum:
        - 1h
        - 6h
        - 24h
        - 7d
    metrics_unit:
      type: string
      description: The unit of a panel's values.
      enum:
        - cores
        - bytes
        - bytes_per_second
        - count
        - per_second
        - ratio
        - seconds
    metrics_point:
      type: object
      required:
        - t
        - v
      properties:
        t:
          type: integer
          format: int64
          description: Unix time in seconds.
        v:
          type: number
          format: double
    metrics_series:
      type: object
      required:
        - name
        - points
      properties:
        name:
          type: string
          description: The series label shown in the legend, such as "Received".
        points:
          type: array
          items:
            $ref: '#/components/schemas/metrics_point'
    metrics_panel:
      type: object
      required:
        - id
        - title
        - unit
        - series
      properties:
        id:
          type: string
          description: Stable identifier of the panel, such as "memory".
        title:
          type: string
        unit:
          $ref: '#/components/schemas/metrics_unit'
        series:
          type: array
          items:
            $ref: '#/components/schemas/metrics_series'
        limit:
          type: number
          format: double
          description: The component's limit for this panel, such as its memory limit, when it has one.
        limit_points:
          type: array
          items:
            $ref: '#/components/schemas/metrics_point'
          description: The limit over the range, so usage is compared with the limit that applied at the time. Present when limit is.
    component_metrics_response:
      type: object
      required:
        - range
        - from
        - to
        - step_seconds
        - panels
      properties:
        range:
          $ref: '#/components/schemas/metrics_range'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        step_seconds:
          type: integer
          format: int32
        panels:
          type: array
          items:
            $ref: '#/components/schemas/metrics_panel'
    component_run_logs_request:
      type: object
      description: Constrained Component Run Logs request. Does not accept arbitrary LogsQL; clients can only select a view, bounded time range, limit, levels, event sources, and message text.
      additionalProperties: false
      properties:
        view:
          type: string
          enum:
            - timeline
            - raw
            - both
          default: both
          description: Which run log projection to return.
        from:
          type: string
          format: date-time
          description: Inclusive lower bound for the run log time range.
        to:
          type: string
          format: date-time
          description: Inclusive upper bound for the run log time range.
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 200
          description: Maximum number of most recent raw backend records to query.
        levels:
          type: array
          items:
            type: string
          description: Optional log levels to include.
        source:
          type: array
          items:
            type: string
            enum:
              - control_plane
              - agent
              - builder
          description: Optional timeline event sources to include.
        text:
          type: string
          description: Optional phrase to search in the log message.
    component_run_logs_response:
      type: object
      required:
        - timeline
        - logs
        - meta
      properties:
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/component_run_timeline_event'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/logs_query_entry'
        meta:
          $ref: '#/components/schemas/component_run_logs_meta'
    component_run_logs_meta:
      type: object
      required:
        - component_run_id
        - logs_backend
        - default_time_range_applied
        - details_available
        - pipeline_context
      properties:
        component_run_id:
          $ref: '#/components/schemas/uuid'
        logs_backend:
          type: string
          enum:
            - victoria_logs
        default_time_range_applied:
          type: boolean
        details_available:
          type: boolean
          description: Whether retained Agent or Builder log details were available for this run.
        details_unavailable_reason:
          type: string
          description: Safe user-facing reason returned when run details are unavailable or expired.
        pipeline_context:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/component_run_pipeline_context'
    component_run_timeline_event:
      type: object
      required:
        - time
        - level
        - source
        - step
        - phase
        - message
        - duration_ms
      properties:
        time:
          type: string
          description: The RFC3339 or RFC3339Nano timestamp returned by Victoria Logs.
        level:
          type: string
        source:
          type: string
        step:
          type: string
        phase:
          type: string
        backend:
          type: string
        backend_step:
          type: string
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: Safe structured metadata parsed from kapten_io_metadata when present.
        duration_ms:
          type: integer
          format: int64
          nullable: true
        run_status:
          type: string
        error_kind:
          type: string
        event:
          type: string
          description: Versioned event discriminator when this is a structured build event.
          enum:
            - kapten.build.phase
        event_version:
          type: integer
          format: int32
        platform:
          type: string
          enum:
            - linux/amd64
            - linux/arm64
        publication:
          type: string
          enum:
            - child_manifest
            - final_index
    cloud_provider:
      type: string
      enum:
        - custom
        - aws
        - gcp
      description: The cloud provider for the cluster.
    container_registry:
      type: object
      required:
        - id
        - organization_id
        - s_id
        - name
        - type
        - configuration
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        organization_id:
          $ref: '#/components/schemas/uuid'
        s_id:
          type: string
          description: Short identifier for the container registry resource.
        name:
          type: string
          description: Name of the container registry.
        description:
          type: string
          description: Optional container registry description.
        type:
          allOf:
            - $ref: '#/components/schemas/container_registry_type'
          description: Container registry type.
        configuration:
          $ref: '#/components/schemas/container_registry_configuration'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the container registry was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the container registry was last updated.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the container registry was deleted.
    container_registry_type:
      type: string
      description: Container registry type.
      enum:
        - STANDARD
        - ECR
        - GCP_ARTIFACT_REGISTRY
        - SCALEWAY
    container_registry_configuration:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Public registry URL.
        region:
          type: string
          description: Registry region when the provider exposes one.
        role_arn:
          type: string
          description: Optional AWS IAM role ARN for ECR access.
    create_container_registry:
      oneOf:
        - $ref: '#/components/schemas/create_standard_container_registry'
        - $ref: '#/components/schemas/create_ecr_container_registry'
        - $ref: '#/components/schemas/create_gcp_artifact_registry_container_registry'
        - $ref: '#/components/schemas/create_scaleway_container_registry'
      discriminator:
        propertyName: type
        mapping:
          STANDARD: '#/components/schemas/create_standard_container_registry'
          ECR: '#/components/schemas/create_ecr_container_registry'
          GCP_ARTIFACT_REGISTRY: '#/components/schemas/create_gcp_artifact_registry_container_registry'
          SCALEWAY: '#/components/schemas/create_scaleway_container_registry'
    update_container_registry:
      type: object
      properties:
        name:
          type: string
          description: Updated container registry name.
        description:
          type: string
          description: Updated container registry description.
        url:
          type: string
          description: Updated registry URL.
        username:
