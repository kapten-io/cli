    application_port:
      type: object
      required:
        - name
        - is_default
        - internal_port
        - protocol
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: Human-readable port name.
        is_default:
          type: boolean
          description: Whether this is the default port for future domain routing.
        internal_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Listening port inside the application.
        external_port:
          type: integer
          minimum: 1
          maximum: 65535
          nullable: true
          description: Optional exposed port, persisted for future exposure features.
        protocol:
          $ref: '#/components/schemas/application_protocol'
    application_storage:
      type: object
      required:
        - name
        - mount_path
        - size_in_gib
        - storage_type
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: Human-readable storage name.
        mount_path:
          type: string
          description: Absolute path mounted into the application.
        size_in_gib:
          type: integer
          minimum: 1
          description: Persistent volume size in GiB.
        storage_type:
          type: string
          description: Kubernetes storage class name.
