openapi: 3.0.0
info:
  version: 1.0.0
  title: Kapten API
  description: Manage projects, environments, applications, jobs, databases, pipelines, clusters and their configuration.
  contact:
    url: https://kapten.io
    name: Kapten Support
    email: support@kapten.io
servers:
  - url: https://api.kapten.io
    description: Production
  - url: https://api-staging.kapten.io
    description: Staging
  - url: http://localhost:9000
    description: Local development stack
security:
  - bearerAuth: []
tags:
  - name: authorization
    description: Resources that Role grants can target
  - name: cluster
    description: Kubernetes clusters connected to the organization
  - name: container-registry
    description: Registries Kapten pulls images from and pushes builds to
  - name: application
    description: Long-running applications, built from GitHub or deployed from an image
  - name: database
    description: PostgreSQL, MySQL, MongoDB and Redis databases
  - name: component
    description: Every component of an environment, and their logs
  - name: pipeline
    description: Deploy several components in ordered stages
  - name: Project Variables
    description: Variables shared by every environment of a project
  - name: Environment Variables
    description: Variables shared by every component of an environment
  - name: Component Variables
    description: Variables of one component
  - name: Component Secret
    description: Secrets of one component
  - name: Project Secret
    description: Secrets shared by every environment of a project
  - name: Environment Secret
    description: Secrets shared by every component of an environment
  - name: github
    description: GitHub App installations, their repositories and branches
  - name: audit
    description: Changes made to the organization's resources
  - name: usage
    description: Environment usage, metered per minute
paths:
  /audit-events:
    get:
      operationId: listAuditEvents
      x-cli-ignore: true
      tags:
        - audit
      summary: List audit events
      description: 'Events recorded in the token''s organization about projects, environments, components, variables, pipelines, clusters and integrations, newest first. Without a target filter it requires audit:read on the organization and returns every event, including denials and their origin. With `target_type` `project` or `environment` and a `target_id`, the read Permission on that resource is enough: the events about it and everything it contains are returned, without denials or origin. The Auth API serves the organization''s own events (members, Roles, OAuth applications, sign-ins) with the same schema and filters.'
      parameters:
        - $ref: '#/components/parameters/audit_action'
        - $ref: '#/components/parameters/audit_actor_id'
        - $ref: '#/components/parameters/audit_target_type'
        - $ref: '#/components/parameters/audit_target_id'
        - $ref: '#/components/parameters/audit_affected_user_id'
        - $ref: '#/components/parameters/audit_outcome'
        - $ref: '#/components/parameters/audit_changed_field'
        - $ref: '#/components/parameters/audit_since'
        - $ref: '#/components/parameters/audit_until'
        - $ref: '#/components/parameters/audit_cursor'
        - $ref: '#/components/parameters/audit_limit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/audit_event_page'
        default:
          $ref: '#/components/responses/error_response'
  /authorization/resources:
    get:
      operationId: listAuthorizationResources
      x-cli-ignore: true
      tags:
        - authorization
      summary: List resources for Role grants
      description: Names and IDs of the organization's resources that a Role grant can target. Requires the Permission to create or update Roles. Returns no secret.
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - project
              - environment
              - cluster
              - integration
        - in: query
          name: ids
          description: Optional comma-separated UUIDs to validate (at most 100).
          schema:
            type: string
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Up to 100 identities; request the next offset until fewer than 100 records are returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - records
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        parentName:
                          type: string
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '503':
          description: Authorization or resource catalog unavailable
  /cluster:
    get:
      summary: List clusters
      description: Returns the organization's clusters, a page at a time.
      operationId: listClusters
      x-cli-name: list
      tags:
        - clusters
        - cluster
      parameters:
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
        - $ref: '#/components/parameters/with_deleted'
      responses:
        '200':
          description: List of clusters retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Connect a cluster
      description: Connects a Kubernetes cluster from its kubeconfig. Kapten then installs its agent on the cluster.
      operationId: createCluster
      x-cli-name: create
      tags:
        - clusters
        - cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_cluster_dto'
      responses:
        '200':
          description: Cluster created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}:
    parameters:
      - $ref: '#/components/parameters/cluster_id'
    get:
      summary: Get a cluster
      description: Returns a cluster.
      operationId: getCluster
      x-cli-name: get
      tags:
        - clusters
        - cluster
      responses:
        '200':
          description: Cluster retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
    put:
      summary: Update a cluster
      description: Updates a cluster's settings.
      operationId: updateCluster
      x-cli-name: update
      tags:
        - clusters
        - cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_cluster_dto'
      responses:
        '200':
          description: Cluster updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
    delete:
      summary: Delete a cluster
      description: Removes a cluster from the organization.
      operationId: deleteCluster
      x-cli-name: delete
      tags:
        - clusters
        - cluster
      responses:
        '204':
          description: Cluster deleted successfully
        default:
          $ref: '#/components/responses/error_response'
  /cluster/{cluster_id}/sync:
    parameters:
      - $ref: '#/components/parameters/cluster_id'
    post:
      summary: Sync a cluster
      description: Runs the cluster's setup again, as when it was connected.
      operationId: syncCluster
      x-cli-ignore: true
      tags:
        - cluster
      responses:
        '200':
          description: Cluster sync scheduled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster'
        default:
          $ref: '#/components/responses/error_response'
  /container-registry:
    get:
      summary: List container registries
      description: Returns the organization's container registries, a page at a time.
      operationId: listContainerRegistries
      x-cli-ignore: true
      tags:
        - container-registry
      parameters:
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
        - $ref: '#/components/parameters/with_deleted'
      responses:
        '200':
          description: Container registries retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/container_registry'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Create a container registry
      description: Adds a container registry to the organization, with the credentials Kapten uses to pull and push images.
      operationId: createContainerRegistry
      x-cli-ignore: true
      tags:
        - container-registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_container_registry'
      responses:
        '200':
          description: Container registry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/container_registry'
        default:
          $ref: '#/components/responses/error_response'
  /container-registry/{container_registry_id}:
    get:
      summary: Get a container registry
      description: Returns a container registry.
      operationId: getContainerRegistry
      x-cli-ignore: true
      tags:
        - container-registry
      parameters:
        - $ref: '#/components/parameters/container_registry_id'
        - $ref: '#/components/parameters/with_deleted'
      responses:
        '200':
          description: Container registry retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/container_registry'
        default:
          $ref: '#/components/responses/error_response'
    put:
      summary: Update a container registry
      description: Updates a container registry and its credentials.
      operationId: updateContainerRegistry
      x-cli-ignore: true
      tags:
        - container-registry
      parameters:
        - $ref: '#/components/parameters/container_registry_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_container_registry'
      responses:
        '200':
          description: Container registry updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/container_registry'
        default:
          $ref: '#/components/responses/error_response'
    delete:
      summary: Delete a container registry
      description: Removes a container registry and deletes its stored credentials.
      operationId: deleteContainerRegistry
      x-cli-ignore: true
      tags:
        - container-registry
      parameters:
        - $ref: '#/components/parameters/container_registry_id'
      responses:
        '204':
          description: Container registry deleted successfully
        default:
          $ref: '#/components/responses/error_response'
  /project:
    get:
      summary: List projects
      description: Returns the organization's projects, a page at a time.
      operationId: listProjects
      x-cli-name: list
      tags:
        - projects
        - project
      parameters:
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
        - $ref: '#/components/parameters/with_deleted'
      responses:
        '200':
          description: List of projects retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/project'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Create a project
      description: Creates a project and returns it.
      operationId: createProject
      x-cli-name: create
      tags:
        - projects
        - project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_project_dto'
      responses:
        '200':
          description: project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}:
    get:
      summary: Get a project
      description: Returns a project.
      operationId: getProject
      x-cli-name: get
      tags:
        - projects
        - project
      parameters:
        - $ref: '#/components/parameters/project_id'
      responses:
        '200':
          description: project retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
        default:
          $ref: '#/components/responses/error_response'
    put:
      summary: Update a project
      description: Updates a project's name and description.
      operationId: updateProject
      x-cli-name: update
      tags:
        - projects
        - project
      parameters:
        - $ref: '#/components/parameters/project_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_project_dto'
      responses:
        '200':
          description: project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
        default:
          $ref: '#/components/responses/error_response'
    delete:
      summary: Delete a project
      description: Deletes a project.
      operationId: deleteProject
      x-cli-name: delete
      tags:
        - projects
        - project
      parameters:
        - $ref: '#/components/parameters/project_id'
      responses:
        '204':
          description: project deleted successfully
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/variable:
    get:
      summary: List project variables
      description: Returns the variables set on the project, a page at a time.
      operationId: listProjectVariables
      x-cli-ignore: true
      tags:
        - Project Variables
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
      responses:
        '200':
          description: List of variables retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Create a project variable
      description: Sets a variable on the project, as a key-value pair or a file.
      operationId: createProjectVariable
      x-cli-ignore: true
      tags:
        - Project Variables
      parameters:
        - $ref: '#/components/parameters/project_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_project_variable_dto'
      responses:
        '200':
          description: Variable created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/variable/{variable_id}:
    delete:
      summary: Delete a project variable
      description: Deletes a variable from the project.
      operationId: deleteProjectVariable
      x-cli-ignore: true
      tags:
        - Project Variables
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/variable_id'
      responses:
        '204':
          description: Variable deleted successfully
        default:
          $ref: '#/components/responses/error_response'
    patch:
      summary: Update a project variable
      description: Updates a variable's key, value or type.
      operationId: updateProjectVariable
      x-cli-ignore: true
      tags:
        - Project Variables
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/variable_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_project_variable_dto'
      responses:
        '200':
          description: Variable updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/secret:
    get:
      summary: List project secrets
      description: Returns the secrets set on the project, a page at a time.
      operationId: listProjectSecrets
      x-cli-ignore: true
      tags:
        - Project Secret
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
      responses:
        '200':
          description: List of secrets retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Create a project secret
      description: Sets a secret on the project, as a key-value pair or a file.
      operationId: createProjectSecret
      x-cli-ignore: true
      tags:
        - Project Secret
      parameters:
        - $ref: '#/components/parameters/project_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_project_secret_dto'
      responses:
        '200':
          description: Secret created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/secret/{variable_id}:
    delete:
      summary: Delete a project secret
      description: Deletes a secret from the project.
      operationId: deleteProjectSecret
      x-cli-ignore: true
      tags:
        - Project Secret
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/variable_id'
      responses:
        '204':
          description: Secret deleted successfully
        default:
          $ref: '#/components/responses/error_response'
    patch:
      summary: Update a project secret
      description: Updates a secret's key, value or type.
      operationId: updateProjectSecret
      x-cli-ignore: true
      tags:
        - Project Secret
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/variable_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_project_secret_dto'
      responses:
        '200':
          description: Secret updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/environment:
    get:
      summary: List environments
      description: Returns a project's environments, a page at a time.
      operationId: listEnvironments
      x-cli-name: list
      tags:
        - environments
        - environment
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
        - $ref: '#/components/parameters/with_deleted'
      responses:
        '200':
          description: List of environments retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/environment'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Create an environment
      description: Creates an environment in a project, on one of the organization's clusters.
      operationId: createEnvironment
      x-cli-name: create
      parameters:
        - $ref: '#/components/parameters/project_id'
      tags:
        - environments
        - environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_environment_dto'
      responses:
        '200':
          description: Environment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/environment/{environment_id}:
    get:
      summary: Get an environment
      description: Returns an environment.
      operationId: getEnvironment
      x-cli-name: get
      tags:
        - environments
        - environment
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
      responses:
        '200':
          description: Environment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment'
        default:
          $ref: '#/components/responses/error_response'
    put:
      summary: Update an environment
      description: Updates an environment. Fields left out keep their value.
      operationId: updateEnvironment
      x-cli-name: update
      tags:
        - environments
        - environment
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_environment_dto'
      responses:
        '200':
          description: Environment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment'
        default:
          $ref: '#/components/responses/error_response'
    delete:
      summary: Delete an environment
      description: Deletes an environment, with its variables and secrets. This cannot be undone.
      operationId: deleteEnvironment
      x-cli-name: delete
      tags:
        - environments
        - environment
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
      responses:
        '204':
          description: Environment deleted successfully
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/environment/{environment_id}/logs:
    post:
      summary: Query environment logs
      description: Returns the environment's log entries that match the query, read through Kapten's agent on its cluster.
      operationId: queryEnvironmentLogs
      x-cli-ignore: true
      tags:
        - environment
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/logs_query_request'
      responses:
        '200':
          description: Environment logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logs_query_response'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/environment/{environment_id}/secret:
    get:
      summary: List environment secrets
      description: Returns the secrets set on the environment, a page at a time.
      operationId: listEnvironmentSecrets
      x-cli-ignore: true
      tags:
        - Environment Secret
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
        - $ref: '#/components/parameters/include_inherited'
        - $ref: '#/components/parameters/pagination_limit'
        - $ref: '#/components/parameters/pagination_number'
      responses:
        '200':
          description: List of secrets retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated_response'
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
    post:
      summary: Create an environment secret
      description: Sets a secret on the environment, as a key-value pair or a file.
      operationId: createEnvironmentSecret
      x-cli-ignore: true
      tags:
        - Environment Secret
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_environment_secret_dto'
      responses:
        '200':
          description: Secret created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/variable'
        default:
          $ref: '#/components/responses/error_response'
  /project/{project_id}/environment/{environment_id}/secret/{variable_id}:
    delete:
      summary: Delete an environment secret
      description: Deletes a secret from the environment.
      operationId: deleteEnvironmentSecret
      x-cli-ignore: true
      tags:
        - Environment Secret
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/environment_id'
        - $ref: '#/components/parameters/variable_id'
      responses:
        '204':
          description: Secret deleted successfully
        default:
          $ref: '#/components/responses/error_response'
    patch:
      summary: Update an environment secret
      description: Updates a secret's key, value or type.
      operationId: updateEnvironmentSecret
      x-cli-ignore: true
      tags:
        - Environment Secret
      parameters:
