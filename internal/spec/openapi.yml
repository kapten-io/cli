              $ref: '#/components/headers/retry_after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/error_response'
  /usage/environments:
    get:
      operationId: getEnvironmentUsage
      x-cli-name: environments
      tags:
        - usage
      summary: Get environment usage
      description: 'How long each environment of the token''s organization was active in the period [since, until), from its creation to its deletion. Usage is counted in hourly UTC windows: both bounds are truncated to the hour, and a period spans at most 93 days. Only hours before `closed_through` are counted, and an hour closes about five minutes after it ends. Environments that were not active in the period are left out. Requires organization_update on the organization. The billable minutes are the ones the subscription is billed for.'
      parameters:
        - name: since
          in: query
          required: true
          description: Start of the period, truncated to the hour.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: true
          description: End of the period (exclusive), truncated to the hour.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The usage of the period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment_usage_report'
        default:
          $ref: '#/components/responses/error_response'
