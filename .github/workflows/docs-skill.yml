name: Docs skill

# plugin/skills/kapten-docs is a copy of the skill docs.kapten.io generates. This
# fails when the published skill changed, so someone runs
# `mise run skills:docs` and commits the result.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: kapten-docs skill is current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/skills-docs-sync --check
