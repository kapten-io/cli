name: Release

# "Run workflow" on main releases main's head as the next version, picked
# from the commit titles since the latest release (scripts/release-next):
# builds the archives, signs a packslip manifest of them, publishes them as a
# GitHub release tagged vX.Y.Z, then on npm, and installs the published
# release with mise and npx.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version and notes come from the commits since the latest release
          persist-credentials: false

      - name: Pick the version
        id: version
        run: |
          version="$(./scripts/release-next)"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - run: mise run quality

      - name: Build the archives
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./scripts/release-build "$TAG"
          ./scripts/release-notes "$TAG" >dist/notes.md
          echo "Releasing $TAG" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/kapten_*
            dist/checksums.txt
            dist/notes.md
          if-no-files-found: error

  # Signs the manifest that mise and other packslip consumers verify, with this
  # workflow's identity, and attests the archives' build provenance. Runs
  # apart from the job that can write the release (packslip's guidance).
  packslip:
    name: Sign
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # sign with the workflow's identity
      attestations: write # attest the archives' provenance
    steps:
      # Resources taken from the repository (repo:) are read at the released commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        id: packslip
        with:
          artifacts: dist/kapten_*.tar.gz dist/kapten_*.zip
          tag: ${{ needs.build.outputs.tag }}
          bin: kapten
          resources: |
            completion/bash,zsh,fish/kapten=exec:kapten completion {shell}
            skill/kapten=repo:skills/kapten
          upload: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, packslip]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip
          path: dist

      # A draft until every file is uploaded; a rerun replaces the draft's
      # files. Publishing the draft creates the tag on the released commit.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Kapten CLI $TAG" --notes-file dist/notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/kapten_* dist/checksums.txt dist/packslip.sigstore.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # @kapten/cli and its platform packages, from the same archives. Trusted
  # publishing: npm accepts this workflow in the npm environment (main only)
  # without a token, and records the provenance.
  npm:
    name: npm
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11.5 or later publishes with OIDC
          registry-url: https://registry.npmjs.org

      # Platform packages first: the launcher depends on them. A rerun skips
      # the versions already published.
      - name: Publish
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/release-npm "$TAG" dist npm-packages
          # ./ makes npm read a folder, not a GitHub user/repo shorthand
          for package in ./npm-packages/cli-* ./npm-packages/cli; do
            name="$(jq -r .name "$package/package.json")"
            version="$(jq -r .version "$package/package.json")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "$package" --access public
          done

  # The product docs of kapten-io/kapten generate the command reference and
  # the agent skills from a pinned CLI version: this opens or updates the
  # pull request that moves them to this release, as the GitHub App Kapten
  # Release, whose key the environment `release` lends to main only.
  docs:
    name: Docs pull request
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # GitHub accepts the App ID wherever it takes the client ID
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: kapten-io
          repositories: kapten
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ./scripts/release-docs-pr "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  plugin:
    name: Agent plugin
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # GitHub accepts the App ID wherever it takes the client ID
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: kapten-io
          repositories: skills
          permission-contents: write

      - name: Publish to kapten-io/skills
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ./scripts/release-plugin "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    needs: [build, publish, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # Installs the published release as users would: with mise, which
      # verifies the packslip signature and digests, and with npx
      - run: mise run release:verify -- "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
