# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kapten-io
    repo_name: cli
    description: Manage Kapten resources from the command line
    asset: kapten_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: kapten
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
    overrides:
      - goos: windows
        format: zip
    supported_envs:
      - darwin
      - linux
      - windows
      - amd64
      - arm64
